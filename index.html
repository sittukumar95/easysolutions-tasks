<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Solutions — Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0ede6;
  --surface:#ffffff;
  --surface2:#faf8f4;
  --surface3:#f5f0e8;
  --border:#e8e0d0;
  --border2:#d8ccb4;
  --text:#1a1610;
  --text2:#3a3020;
  --muted:#9a8c70;
  --accent:#e07808;
  --accent2:#f5a020;
  --gold:#f5a020;
  --dark:#1c180e;
  --dark2:#282010;
  --sidebar-w:224px;
  --topbar-h:60px;
  --radius:10px;
  --font:'Inter',sans-serif;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow:0 1px 4px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.06);
  --shadow-lg:0 8px 28px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.08);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}

/* ════════════════════════════════ LAYOUT */
.app{display:flex;height:100vh;overflow:hidden;}

/* ════════════════════════════════ SIDEBAR */
.sidebar{
  width:var(--sidebar-w);background:var(--dark);
  display:flex;flex-direction:column;flex-shrink:0;
  position:relative;overflow:hidden;
}
.sidebar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:200px;
  background:linear-gradient(to top,rgba(245,160,32,.04),transparent);
  pointer-events:none;
}
.logo{
  padding:14px 16px;
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:10px;
  height:var(--topbar-h);
}
.logo img{width:32px;height:32px;object-fit:contain;border-radius:6px;flex-shrink:0;}
.logo-text .logo-name{
  font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:800;
  color:#f5a020;letter-spacing:.2px;line-height:1.2;
}
.logo-text .logo-sub{
  font-size:8.5px;font-weight:600;
  color:rgba(245,160,32,.4);letter-spacing:1.8px;text-transform:uppercase;
}
.nav{padding:8px 8px;flex:1;overflow-y:auto;}
.nav::-webkit-scrollbar{width:0;}
.nav-section{
  font-size:8.5px;font-weight:700;
  color:rgba(255,255,255,.2);
  letter-spacing:1.8px;text-transform:uppercase;
  padding:12px 8px 4px;
}
.nav-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:8px;
  cursor:pointer;color:rgba(255,255,255,.4);
  font-size:13px;font-weight:400;
  transition:all .15s;margin-bottom:1px;
  border:none;background:none;width:100%;
  text-align:left;font-family:var(--font);
  position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.75);}
.nav-item.active{
  background:rgba(245,160,32,.12);color:#f5a020;font-weight:500;
}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:60%;background:#f5a020;border-radius:0 2px 2px 0;
}
.nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
.nav-label{flex:1;}
.nav-badge{
  background:#e07808;color:#fff;
  font-size:9.5px;font-weight:700;
  padding:1px 6px;border-radius:10px;
  min-width:18px;text-align:center;
}
.nav-badge.red{background:#dc2626;}
.sidebar-footer{
  padding:10px;
  border-top:1px solid rgba(255,255,255,.06);
}
.user-pill{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:8px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
}
.avatar{
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;flex-shrink:0;font-size:11px;
}
.user-name{font-size:12.5px;font-weight:500;color:rgba(255,255,255,.75);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-dept{font-size:10px;color:rgba(245,160,32,.5);display:flex;align-items:center;gap:3px;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.logout-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.2);font-size:14px;padding:3px;transition:color .15s;margin-left:auto;flex-shrink:0;}
.logout-btn:hover{color:rgba(245,160,32,.6);}

/* ════════════════════════════════ MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* ════════════════════════════════ TOPBAR */
.topbar{
  height:var(--topbar-h);
  padding:0 24px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  justify-content:space-between;
  flex-shrink:0;gap:16px;
  box-shadow:var(--shadow-sm);
}
.topbar-left{}
.page-title{font-size:16px;font-weight:700;color:var(--text);line-height:1.2;}
.page-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

/* ════════════════════════════════ CONTENT */
.content{flex:1;overflow-y:auto;padding:20px 24px;}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* ════════════════════════════════ BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:7px 14px;border-radius:7px;
  font-size:12.5px;font-weight:600;cursor:pointer;
  border:none;font-family:var(--font);
  transition:all .15s;white-space:nowrap;line-height:1.4;
}
.btn-primary{
  background:linear-gradient(135deg,#f5a020,#e07808);
  color:#fff;box-shadow:0 2px 6px rgba(224,120,8,.3);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(224,120,8,.4);}
.btn-ghost{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--surface3);color:var(--text);border-color:var(--border2);}
.btn-danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;}
.btn-danger:hover{background:#fee2e2;}
.btn-success{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;}
.btn-warn{background:#fffbeb;color:#d97706;border:1px solid #fde68a;}
.btn-info{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;}
.btn-tg{background:#e8f4fd;color:#0088cc;border:1px solid #bae6fd;}
.btn-pdf{background:#fef2f2;color:#dc2626;border:1px solid #fecada;}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn-xs{padding:3px 8px;font-size:11px;}

/* ════════════════════════════════ CARDS */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
}
.card-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}

/* ════════════════════════════════ STAT CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent2),var(--gold));
}
.stat-card.blue::before{background:linear-gradient(90deg,#60a5fa,#3b82f6);}
.stat-card.green::before{background:linear-gradient(90deg,#34d399,#10b981);}
.stat-card.red::before{background:linear-gradient(90deg,#f87171,#ef4444);}
.stat-val{font-size:28px;font-weight:800;font-family:'Montserrat',sans-serif;line-height:1;}
.stat-lbl{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}

/* ════════════════════════════════ BADGES */
.badge{
  display:inline-flex;align-items:center;
  padding:2px 8px;border-radius:20px;
  font-size:10.5px;font-weight:600;white-space:nowrap;
}
.badge-todo{background:#f3f4f6;color:#6b7280;border:1px solid #e5e7eb;}
.badge-progress{background:#fffbeb;color:#b45309;border:1px solid #fde68a;}
.badge-done{background:#f0fdf4;color:#15803d;border:1px solid #86efac;}
.badge-urgent{background:#fff1f2;color:#be123c;border:1px solid #fecdd3;}
.badge-high{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;}
.badge-medium{background:#fffbeb;color:#a16207;border:1px solid #fde68a;}
.badge-low{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;}
.badge-overdue{background:#fff1f2;color:#be123c;border:1px solid #fecdd3;}
.badge-recurring{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;}
.dept-tag{
  display:inline-flex;align-items:center;
  padding:2px 7px;border-radius:4px;
  font-size:10.5px;font-weight:600;
  background:#fefce8;color:#854d0e;border:1px solid #fef08a;
}

/* ════════════════════════════════ TASK ITEMS */
.task-list{display:flex;flex-direction:column;gap:6px;}
.task-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;
  cursor:pointer;transition:all .15s;
  display:flex;flex-direction:column;gap:6px;
  box-shadow:var(--shadow-sm);
}
.task-item:hover{border-color:var(--accent2);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.task-item.overdue{border-left:3px solid #ef4444;padding-left:11px;}
.task-item.recurring{border-left:3px solid #3b82f6;padding-left:11px;}
.task-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.task-name{font-size:13.5px;font-weight:600;color:var(--text);flex:1;line-height:1.4;}
.task-badges{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0;align-items:center;}
.task-bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.task-meta{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);}

/* ════════════════════════════════ MEMBER CARDS */
.member-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);margin-bottom:8px;
  display:flex;align-items:flex-start;gap:14px;
  transition:all .15s;
}
.member-card:hover{box-shadow:var(--shadow-md);border-color:var(--border2);}
.member-info{flex:1;min-width:0;}
.member-name{font-size:14px;font-weight:700;color:var(--text);}
.member-email{font-size:11.5px;color:var(--muted);margin-top:2px;}
.member-badges{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0;}
.member-actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0;}
.progress-wrap{display:flex;align-items:center;gap:8px;}
.prog-bar{flex:1;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;transition:width .5s ease;}
.prog-pct{font-size:11px;font-weight:600;color:var(--muted);flex-shrink:0;width:28px;text-align:right;}

/* ════════════════════════════════ ANNOUNCEMENTS */
.ann-card{
  background:linear-gradient(135deg,#fffef7,#fffbeb);
  border:1px solid #fde68a;border-left:3px solid var(--accent2);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;
}
.ann-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.ann-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;font-weight:700;color:#92400e;
  background:#fef9c3;padding:2px 8px;border-radius:20px;
  text-transform:uppercase;letter-spacing:.5px;
}
.ann-title{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:4px;}
.ann-body{font-size:12.5px;color:var(--text2);line-height:1.6;}
.ann-time{font-size:11px;color:var(--muted);margin-top:6px;}

/* ════════════════════════════════ FILTERS */
.filter-section{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;
  margin-bottom:14px;box-shadow:var(--shadow-sm);
}
.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.filter-label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;flex-shrink:0;}
.filter-sel{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;padding:5px 10px;
  font-size:12px;color:var(--text);font-family:var(--font);
  outline:none;cursor:pointer;transition:border-color .15s;
}
.filter-sel:focus{border-color:var(--accent2);}
.filter-divider{width:1px;height:18px;background:var(--border);flex-shrink:0;}

/* ════════════════════════════════ STATUS TABS */
.status-tabs{display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:8px;margin-bottom:14px;border:1px solid var(--border);}
.stab{
  flex:1;padding:6px 8px;border-radius:6px;border:none;
  background:none;color:var(--muted);font-size:12px;font-weight:600;
  cursor:pointer;font-family:var(--font);transition:all .15s;text-align:center;
}
.stab.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm);border:1px solid var(--border);}

/* ════════════════════════════════ SEARCH */
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:8px;padding:8px 12px;margin-bottom:14px;
  transition:border-color .15s;box-shadow:var(--shadow-sm);
}
.search-box:focus-within{border-color:var(--accent2);}
.search-box input{border:none;background:none;outline:none;font-size:13px;color:var(--text);font-family:var(--font);width:100%;}
.search-box input::placeholder{color:var(--muted);}
.search-icon{font-size:14px;color:var(--muted);flex-shrink:0;}
.clear-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;padding:0;line-height:1;}
.clear-btn:hover{color:var(--text);}

/* ════════════════════════════════ MODAL */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;backdrop-filter:blur(4px);
}
.modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:0;width:100%;max-width:500px;
  max-height:90vh;overflow:hidden;
  box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;
}
.modal-head{
  padding:18px 22px 14px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.modal-title{font-size:15px;font-weight:700;color:var(--text);}
.modal-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:2px;transition:color .15s;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:18px 22px;overflow-y:auto;flex:1;}
.modal-body::-webkit-scrollbar{width:3px;}
.modal-body::-webkit-scrollbar-thumb{background:var(--border2);}
.modal-foot{
  padding:12px 22px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:flex-end;gap:8px;
  flex-shrink:0;background:var(--surface2);
}

/* ════════════════════════════════ FORMS */
.form-group{margin-bottom:14px;}
.form-group:last-child{margin-bottom:0;}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.6px;text-transform:uppercase;}
.form-input{
  width:100%;background:var(--surface2);
  border:1.5px solid var(--border);border-radius:7px;
  padding:9px 12px;font-size:13.5px;color:var(--text);
  font-family:var(--font);outline:none;transition:border-color .15s;
}
.form-input:focus{border-color:var(--accent2);background:#fff;}
.form-input::placeholder{color:#c0b090;}
textarea.form-input{resize:vertical;min-height:78px;}
select.form-input{cursor:pointer;}
.form-hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.err-msg{font-size:12px;color:#dc2626;font-weight:500;padding:6px 0;}

/* ════════════════════════════════ PROGRESS BAR (global) */
.progress-bar{height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--gold));border-radius:3px;transition:width .5s ease;}

/* ════════════════════════════════ CREDENTIALS BOX */
.cred-box{background:#f0fdf4;border:1.5px solid #86efac;border-radius:var(--radius);padding:14px;}
.cred-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #bbf7d0;gap:8px;}
.cred-row:last-child{border-bottom:none;}
.cred-label{font-size:12px;color:#15803d;font-weight:600;flex-shrink:0;}
.cred-val{font-family:'Courier New',monospace;font-size:11.5px;font-weight:700;color:#166534;background:#dcfce7;padding:2px 8px;border-radius:4px;word-break:break-all;}

/* ════════════════════════════════ REPORT */
.report-header{
  background:linear-gradient(135deg,var(--dark) 0%,var(--dark2) 100%);
  border-radius:var(--radius);padding:20px 22px;color:#fff;margin-bottom:16px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
}
.report-period-tabs{display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:8px;margin-bottom:14px;border:1px solid var(--border);}
.rtab{flex:1;padding:7px;border-radius:6px;border:none;background:none;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s;text-align:center;}
.rtab.active{background:var(--dark);color:#f5a020;box-shadow:var(--shadow-sm);}
.report-member{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.report-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;}
.rs{text-align:center;padding:10px 6px;border-radius:7px;}
.rs-val{font-size:20px;font-weight:800;font-family:'Montserrat',sans-serif;line-height:1;}
.rs-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:3px;}
.task-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);gap:8px;}
.task-row:last-child{border-bottom:none;}
.task-row-name{font-size:12.5px;font-weight:500;color:var(--text);}
.task-row-meta{font-size:11px;color:var(--muted);margin-top:2px;}

/* ════════════════════════════════ TG SETTINGS */
.tg-status-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;}
.tg-on{background:#f0fdf4;color:#15803d;border:1px solid #86efac;}
.tg-off{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;}
.tg-info-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;}

/* ════════════════════════════════ TOAST */
.toast{
  position:fixed;bottom:24px;right:24px;
  background:var(--dark);color:#fff;
  padding:10px 16px;border-radius:8px;
  font-size:13px;font-weight:500;z-index:9999;
  box-shadow:var(--shadow-lg);animation:slideUp .3s ease;
  max-width:300px;display:flex;align-items:center;gap:8px;
}
.toast.success{border-left:3px solid #22c55e;}
.toast.error{border-left:3px solid #ef4444;}
.toast.info{border-left:3px solid #60a5fa;}
@keyframes slideUp{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ════════════════════════════════ LOGIN */
.login-page{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#fffef8 0%,#fef5dc 45%,#fdf0c8 100%);
  padding:24px;
}
.login-card{
  width:100%;max-width:400px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:36px;box-shadow:var(--shadow-lg);
}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo img{width:76px;height:76px;object-fit:contain;border-radius:12px;margin-bottom:10px;}
.login-logo h1{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:800;color:var(--accent);margin-bottom:2px;}
.login-logo p{font-size:12px;color:var(--muted);}

/* ════════════════════════════════ LOADING */
.loading-page{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:linear-gradient(145deg,#fffef8,#fef5dc);gap:14px;
}
.loading-page img{width:68px;height:68px;object-fit:contain;border-radius:10px;}
.spinner{width:26px;height:26px;border:2.5px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--muted);}

/* ════════════════════════════════ MISC */
.divider{height:1px;background:var(--border);margin:14px 0;}
.section-title{font-size:13px;font-weight:700;color:var(--text);}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:10px;}
.empty-h{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:4px;}
.empty-p{font-size:12.5px;line-height:1.5;}
.flex{display:flex;align-items:center;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.gap-4{gap:4px}.gap-6{gap:6px}.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}
.mb-6{margin-bottom:6px}.mb-10{margin-bottom:10px}.mb-12{margin-bottom:12px}.mb-14{margin-bottom:14px}.mb-16{margin-bottom:16px}.mb-18{margin-bottom:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
</style>

firebase.initializeApp({databaseURL:"https://easysolutions-tasks-default-rtdb.firebaseio.com"});
const db=firebase.database();

// ── Constants ─────────────────────────────────────────────────────
const MGR_EMAIL='manager@easysolutions.com';
const MGR_PASS='Manager@123';
const COLORS=['#f59e0b','#d97706','#b45309','#e8850a','#0891b2','#7c3aed','#059669','#dc2626','#ca8a04','#a16207'];

// ── Telegram ──────────────────────────────────────────────────────
let TG_TOKEN=localStorage.getItem('es_tg_token')||'';
let TG_CHAT=localStorage.getItem('es_tg_chat')||'';
const tgOk=()=>TG_TOKEN&&TG_CHAT;
async function tg(msg){
  if(!tgOk())return;
  try{await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TG_CHAT,text:msg,parse_mode:'HTML'})});}catch(e){}
}

// ── State ─────────────────────────────────────────────────────────
let S={
  user:null,nav:'dashboard',modal:null,
  taskStatus:'all',taskDate:'all',taskMember:'all',taskCustomDate:'',
  memberQ:'',rptPeriod:'daily',rptMember:'all',
  members:{},tasks:{},anns:{},loaded:false
};

// ── Session ───────────────────────────────────────────────────────
const saveSession=u=>{try{localStorage.setItem('es_u',JSON.stringify(u));}catch(e){}};
const loadSession=()=>{try{const s=localStorage.getItem('es_u');return s?JSON.parse(s):null;}catch(e){return null;}};
const clearSession=()=>{try{localStorage.removeItem('es_u');}catch(e){}};

// ── Helpers ───────────────────────────────────────────────────────
const mArr=()=>Object.values(S.members);
const tArr=()=>Object.values(S.tasks);
const aArr=()=>Object.values(S.anns).sort((a,b)=>b.createdAt>a.createdAt?1:-1);
const today=()=>new Date().toISOString().slice(0,10);
const isOv=t=>t.dueDate&&t.dueDate<today()&&t.status!=='done';
const fmt=d=>{if(!d)return'—';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`;};
function dateRange(p){
  const n=new Date();let f=new Date(n);
  if(p==='daily')f.setHours(0,0,0,0);
  else if(p==='weekly')f.setDate(n.getDate()-7);
  else if(p==='monthly')f=new Date(n.getFullYear(),n.getMonth(),1);
  return{from:f.toISOString().slice(0,10),to:n.toISOString().slice(0,10)};
}

// ── Toast ─────────────────────────────────────────────────────────
function toast(msg,type='success',ms=3000){
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<span>${type==='success'?'✓':type==='error'?'✕':'ℹ'}</span><span>${msg}</span>`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),ms);
}

// ── Firebase ──────────────────────────────────────────────────────
function initListeners(){
  db.ref('members').on('value',s=>{S.members=s.val()||{};if(S.loaded)render();});
  db.ref('tasks').on('value',s=>{S.tasks=s.val()||{};if(S.loaded){checkRecurring();render();}});
  db.ref('announcements').on('value',s=>{S.anns=s.val()||{};if(S.loaded)render();});
  let c=0;const chk=()=>{c++;if(c>=3){S.loaded=true;restoreUser();checkRecurring();render();}};
  db.ref('members').once('value',chk);db.ref('tasks').once('value',chk);db.ref('announcements').once('value',chk);
}
function restoreUser(){
  const u=loadSession();if(!u)return;
  if(u.role==='manager'){S.user=u;S.nav='dashboard';}
  else{const m=S.members[u.id];if(m){S.user={role:'member',...m};S.nav='my-tasks';}else clearSession();}
}

// ── Recurring ─────────────────────────────────────────────────────
function checkRecurring(){
  const td=today(),lk=localStorage.getItem('es_rc');
  if(lk===td)return;localStorage.setItem('es_rc',td);
  tArr().filter(t=>t.recurring&&t.status!=='done').forEach(t=>{
    if(t.dueDate<td&&!tArr().some(x=>x.recurringParentId===t.id&&x.dueDate===td)){
      const id='t'+Date.now()+Math.random().toString(36).slice(2,5);
      db.ref('tasks/'+id).set({id,title:t.title,description:t.description,assignedTo:t.assignedTo,priority:t.priority,status:'todo',dueDate:td,createdAt:td,recurring:true,recurringParentId:t.id});
      db.ref('tasks/'+t.id).update({status:'done'});
      const m=S.members[t.assignedTo];
      if(m)tg(`🔄 <b>Daily Task Renewed</b>\n\n📋 <b>${t.title}</b>\n👤 ${m.name}\n📅 Date: ${fmt(td)}\n⚡ Priority: ${t.priority}`);
    }
  });
}

// RENDER
// ══════════════════════════════════════════════════════════════════
function render(){
  const root=document.getElementById('root');
  if(!S.loaded){root.innerHTML=`<div class="loading-page"><img src="${LOGO}"><div class="spinner"></div><div class="loading-text">Connecting to Easy Solutions...</div></div>`;return;}
  if(!S.user){root.innerHTML=renderLogin();bindLogin();return;}
  root.innerHTML=S.user.role==='manager'?renderMgrShell():renderMemShell();
  bindNav();if(S.modal)showModal();
}

// ── LOGIN ─────────────────────────────────────────────────────────
function renderLogin(){
  return`<div class="login-page"><div class="login-card">
    <div class="login-logo"><img src="${LOGO}"><h1>Easy Solutions</h1><p>Task Management Platform</p></div>
    <div class="form-group"><label class="form-label">Email Address</label>
      <input class="form-input" id="li-e" type="email" placeholder="your@easysolutions.com" autocomplete="email"></div>
    <div class="form-group"><label class="form-label">Password</label>
      <input class="form-input" id="li-p" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <div id="li-err" class="err-msg" style="display:none"></div>
    <button class="btn btn-primary" id="li-btn" style="width:100%;padding:10px;font-size:14px;margin-top:4px;">Sign In →</button>
    <p style="text-align:center;font-size:11.5px;color:var(--muted);margin-top:14px;">Contact your manager for login credentials</p>
  </div></div>`;
}
function bindLogin(){
  document.getElementById('li-btn').onclick=doLogin;
  document.getElementById('li-p').onkeydown=e=>{if(e.key==='Enter')doLogin();};
}
function doLogin(){
  const e=document.getElementById('li-e').value.trim().toLowerCase();
  const p=document.getElementById('li-p').value;
  const err=document.getElementById('li-err');err.style.display='none';
  if(e===MGR_EMAIL&&p===MGR_PASS){
    const u={role:'manager',name:'Manager',email:e,avatar:'MG',color:'#f5a020'};
    S.user=u;saveSession(u);S.nav='dashboard';render();return;
  }
  const m=mArr().find(x=>x.email.toLowerCase()===e);
  if(m&&p===m.password){const u={role:'member',...m};S.user=u;saveSession(u);S.nav='my-tasks';render();return;}
  err.textContent='Invalid email or password.';err.style.display='block';
}

// ── MANAGER SHELL ─────────────────────────────────────────────────
function renderMgrShell(){
  const n=S.nav;
  const pending=tArr().filter(t=>t.status!=='done').length;
  const overdue=tArr().filter(t=>isOv(t)).length;
  const tgOn=tgOk();
  let content='';
  if(n==='dashboard')content=renderDash();
  else if(n==='tasks')content=renderTasks();
  else if(n==='members')content=renderMembers();
  else if(n==='reports')content=renderReports();
  else if(n==='announcements')content=renderAnns();
  else if(n==='settings')content=renderSettings();

// ── ALL TASKS ─────────────────────────────────────────────────────
function renderTasks(){
  const all=tArr();let fil=[...all];
  const td=today();
  if(S.taskStatus!=='all')fil=fil.filter(t=>t.status===S.taskStatus);
  if(S.taskDate==='today')fil=fil.filter(t=>t.dueDate===td);
  else if(S.taskDate==='overdue')fil=fil.filter(t=>isOv(t));
  else if(S.taskDate==='week'){const w=new Date();w.setDate(w.getDate()-7);fil=fil.filter(t=>t.dueDate>=w.toISOString().slice(0,10)&&t.dueDate<=td);}
  else if(S.taskDate==='custom'&&S.taskCustomDate)fil=fil.filter(t=>t.dueDate===S.taskCustomDate);
  if(S.taskMember!=='all')fil=fil.filter(t=>t.assignedTo===S.taskMember);
  fil.sort((a,b)=>{const op={urgent:0,high:1,medium:2,low:3};return(op[a.priority]||4)-(op[b.priority]||4);});
  const hasF=S.taskStatus!=='all'||S.taskDate!=='all'||S.taskMember!=='all';
  return`<div class="topbar">
    <div class="topbar-left"><div class="page-title">All Tasks</div><div class="page-sub">${fil.length} of ${all.length} tasks shown</div></div>
    <div class="topbar-right"><button class="btn btn-primary" onclick="openModal('add-task')">＋ New Task</button></div>
  </div>
  <div class="content">
    <div class="status-tabs">
      ${['all','todo','in-progress','done'].map(s=>`<button class="stab ${S.taskStatus===s?'active':''}" onclick="setStat('${s}')">${s==='all'?'All Tasks':s==='in-progress'?'In Progress':s.charAt(0).toUpperCase()+s.slice(1)}</button>`).join('')}
    </div>
    <div class="filter-section">
      <div class="filter-row">
        <span class="filter-label">Filters:</span>
        <select class="filter-sel" onchange="setDateF(this.value)">
          <option value="all" ${S.taskDate==='all'?'selected':''}>📅 All Dates</option>
          <option value="today" ${S.taskDate==='today'?'selected':''}>📌 Today</option>
          <option value="overdue" ${S.taskDate==='overdue'?'selected':''}>🔴 Overdue</option>
          <option value="week" ${S.taskDate==='week'?'selected':''}>📆 This Week</option>
          <option value="custom" ${S.taskDate==='custom'?'selected':''}>🗓 Custom Date</option>
        </select>
        ${S.taskDate==='custom'?`<input type="date" class="filter-sel" value="${S.taskCustomDate}" onchange="setCustomD(this.value)" style="cursor:pointer;">`:''}
        <div class="filter-divider"></div>
        <select class="filter-sel" onchange="setMemF(this.value)">
          <option value="all" ${S.taskMember==='all'?'selected':''}>👥 All Members</option>
          ${mArr().map(m=>`<option value="${m.id}" ${S.taskMember===m.id?'selected':''}>${m.name}${m.department?' · '+m.department:''}</option>`).join('')}
        </select>
        ${hasF?`<div class="filter-divider"></div><button class="btn btn-ghost btn-sm" onclick="clearF()">✕ Clear</button>`:''}
      </div>
    </div>
    ${fil.length===0?`<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-h">No tasks match filters</div><div class="empty-p">Try adjusting your filters above.</div></div>`:`<div class="task-list">${fil.map(t=>taskRow(t,true)).join('')}</div>`}
  </div>`;
}

function saveTG(){
  const t=document.getElementById('tg-tok').value.trim();

  TG_TOKEN=t;TG_CHAT=c;localStorage.setItem('es_tg_token',t);localStorage.setItem('es_tg_chat',c);

            <div><div class="task-row-name">${t.title}${t.recurring?` <span class="badge badge-recurring" style="font-size:9px;">🔄 Daily</span>`:''}</div>
            <div class="task-row-meta">Assigned: ${fmt(t.createdAt)} · Due: ${fmt(t.dueDate)}</div></div>
            <div class="flex gap-4">
              <span class="badge ${'done'===t.status?'badge-done':'in-progress'===t.status?'badge-progress':'badge-todo'}">${t.status==='in-progress'?'Active':t.status==='done'?'Done':'Todo'}</span>
              ${isOv(t)?'<span class="badge badge-overdue">⚠</span>':''}
            </div>
          </div>`).join('')}`:'<div style="color:var(--muted);font-size:12.5px;padding:8px 0;">No tasks assigned.</div>'}
        </div>`;}).join('')}
  </div>`;
}

// ── MEMBER SHELL ──────────────────────────────────────────────────
function renderMemShell(){
  const n=S.nav,me=S.user;
  const myT=tArr().filter(t=>t.assignedTo===me.id);
  const pend=myT.filter(t=>t.status!=='done').length,ov=myT.filter(t=>isOv(t)).length;
  let content='';
  if(n==='my-tasks')content=renderMyTasks();
  else if(n==='announcements')content=renderMemAnns();
  else if(n==='my-report')content=renderMyReport();
  return`<div class="app">
    <aside class="sidebar">
      <div class="logo"><img src="${LOGO}"><div class="logo-text"><div class="logo-name">Easy Solutions</div><div class="logo-sub">Task Manager</div></div></div>
      <nav class="nav">
        <div class="nav-section">My Work</div>
        <button class="nav-item ${n==='my-tasks'?'active':''}" data-nav="my-tasks"><span class="nav-icon">✅</span><span class="nav-label">My Tasks</span>${pend?`<span class="nav-badge">${pend}</span>`:''}</button>
        <button class="nav-item ${n==='my-report'?'active':''}" data-nav="my-report"><span class="nav-icon">📈</span><span class="nav-label">My Report</span>${ov?`<span class="nav-badge red">${ov}</span>`:''}</button>
        <div class="nav-section">Team</div>
        <button class="nav-item ${n==='announcements'?'active':''}" data-nav="announcements"><span class="nav-icon">📢</span><span class="nav-label">Announcements</span>${aArr().length?`<span class="nav-badge">${aArr().length}</span>`:''}</button>
      </nav>
      <div class="sidebar-footer">
        <div class="user-pill">
          <div class="avatar" style="width:30px;height:30px;font-size:10px;background:${me.color}18;color:${me.color};">${me.avatar}</div>
          <div style="flex:1;min-width:0;"><div class="user-name">${me.name}</div><div class="user-dept"><span class="sync-dot"></span>${me.department||'Team Member'}</div></div>
          <button class="logout-btn" onclick="logout()">↩</button>
        </div>
      </div>
    </aside>
    <main class="main">${content}</main>
  </div>`;
}

function renderMyTasks(){
  const me=S.user,myT=tArr().filter(t=>t.assignedTo===me.id);
  const f=S.taskStatus,fil=f==='all'?myT:myT.filter(t=>t.status===f);
  const done=myT.filter(t=>t.status==='done').length,pct=myT.length?Math.round(done/myT.length*100):0,ov=myT.filter(t=>isOv(t)).length;
  return`<div class="topbar">
    <div class="topbar-left"><div class="page-title">My Tasks</div><div class="page-sub">${myT.length} assigned · ${pct}% complete${ov?` · ⚠ ${ov} overdue`:''}</div></div>
  </div>
  <div class="content">
    <div class="grid-3" style="margin-bottom:16px;">
      <div class="stat-card"><div class="stat-val" style="color:var(--muted)">${myT.filter(t=>t.status==='todo').length}</div><div class="stat-lbl">To Do</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--accent)">${myT.filter(t=>t.status==='in-progress').length}</div><div class="stat-lbl">In Progress</div></div>
      <div class="stat-card green"><div class="stat-val" style="color:#10b981">${done}</div><div class="stat-lbl">Completed</div></div>
    </div>
    <div class="card mb-14">
      <div class="flex-between mb-8"><span style="font-size:13px;font-weight:600;">Completion Rate</span><span style="font-size:16px;font-weight:800;font-family:'Montserrat',sans-serif;color:${pct>=70?'#10b981':pct>=40?'#d97706':'#ef4444'}">${pct}%</span></div>
      <div class="progress-bar" style="height:7px;"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="status-tabs">${['all','todo','in-progress','done'].map(s=>`<button class="stab ${f===s?'active':''}" onclick="setStat('${s}')">${s==='all'?'All':s==='in-progress'?'In Progress':s.charAt(0).toUpperCase()+s.slice(1)}</button>`).join('')}</div>
    ${fil.length===0?`<div class="empty-state"><div class="empty-icon">🎉</div><div class="empty-h">All clear!</div><div class="empty-p">No tasks in this category.</div></div>`:`<div class="task-list">${fil.map(t=>taskRow(t,false)).join('')}</div>`}
  </div>`;
}

function renderMemAnns(){
  const anns=aArr();
  return`<div class="topbar"><div class="topbar-left"><div class="page-title">Announcements</div><div class="page-sub">Messages from your manager</div></div></div>
  <div class="content">
    ${anns.length===0?`<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-h">No announcements yet</div></div>`:
      anns.map(a=>`<div class="ann-card"><div class="ann-top"><span class="ann-badge">📢 ${a.pinned?'📌 Pinned':'Notice'}</span></div>
        <div class="ann-title">${a.title}</div><div class="ann-body">${a.body}</div>
        <div class="ann-time">Posted: ${fmt(a.createdAt)}</div>
      </div>`).join('')}
  </div>`;
}

function renderMyReport(){
  const me=S.user,p=S.rptPeriod,{from,to}=dateRange(p);
  const myT=tArr().filter(t=>t.assignedTo===me.id);
  const done=myT.filter(t=>t.status==='done').length,ip=myT.filter(t=>t.status==='in-progress').length,ov=myT.filter(t=>isOv(t)).length;
  const pct=myT.length?Math.round(done/myT.length*100):0;
  return`<div class="topbar">
    <div class="topbar-left"><div class="page-title">My Report</div><div class="page-sub">Personal performance summary</div></div>
    <div class="topbar-right"><button class="btn btn-pdf" onclick="dlMyPDF()">📄 Download PDF</button></div>
  </div>
  <div class="content">
    <div class="report-period-tabs">${['daily','weekly','monthly'].map(x=>`<button class="rtab ${p===x?'active':''}" onclick="S.rptPeriod='${x}';render()">${x.charAt(0).toUpperCase()+x.slice(1)}</button>`).join('')}</div>
    <div class="report-header">
      <div>
        <div style="font-size:10px;color:rgba(245,160,32,.5);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px;">${p} report</div>
        <div style="font-size:18px;font-weight:700;color:#fff;">${me.name}</div>
        <div style="font-size:12px;color:rgba(255,255,255,.4);margin-top:2px;">${me.department||'—'} · ${fmt(from)} — ${fmt(to)}</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:32px;font-weight:800;font-family:'Montserrat',sans-serif;color:${pct>=70?'#34d399':pct>=40?'#fbbf24':'#f87171'}">${pct}%</div>
        <div style="font-size:11px;color:rgba(255,255,255,.4);">completion rate</div>
      </div>
    </div>
    <div class="stats-grid" style="margin-bottom:16px;">
      <div class="stat-card"><div class="stat-val">${myT.length}</div><div class="stat-lbl">Total</div></div>
      <div class="stat-card green"><div class="stat-val" style="color:#10b981">${done}</div><div class="stat-lbl">Done</div></div>
      <div class="stat-card blue"><div class="stat-val" style="color:#3b82f6">${ip}</div><div class="stat-lbl">Active</div></div>
      <div class="stat-card red"><div class="stat-val" style="color:#ef4444">${ov}</div><div class="stat-lbl">Overdue</div></div>
    </div>
    <div class="card">
      <div class="section-title mb-12">All My Tasks</div>
      ${myT.length===0?`<div style="color:var(--muted);font-size:12.5px;">No tasks assigned yet.</div>`:
        myT.map(t=>`<div class="task-row">
          <div><div class="task-row-name">${t.title}${t.recurring?` <span class="badge badge-recurring" style="font-size:9px;">🔄</span>`:''}</div>
          <div class="task-row-meta">Assigned: ${fmt(t.createdAt)} · Due: ${fmt(t.dueDate)}</div></div>
          <div class="flex gap-4">
            <span class="badge ${'done'===t.status?'badge-done':'in-progress'===t.status?'badge-progress':'badge-todo'}">${t.status==='in-progress'?'Active':t.status==='done'?'Done':'Todo'}</span>
            ${isOv(t)?'<span class="badge badge-overdue">⚠ Overdue</span>':''}
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

// ── TASK ROW ──────────────────────────────────────────────────────
function taskRow(t,isMgr){
  const m=S.members[t.assignedTo];
  const pc={'urgent':'badge-urgent','high':'badge-high','medium':'badge-medium','low':'badge-low'}[t.priority]||'badge-todo';
  const sc={'todo':'badge-todo','in-progress':'badge-progress','done':'badge-done'}[t.status]||'badge-todo';
  const sl=t.status==='in-progress'?'In Progress':t.status==='done'?'Done':'To Do';
  const ov=isOv(t);
  return`<div class="task-item${ov?' overdue':''}${t.recurring?' recurring':''}" onclick="openModal('view-task','${t.id}')">
    <div class="task-top">
      <div class="task-name">${t.title}</div>
      <div class="task-badges">
        <span class="badge ${pc}">${t.priority}</span>
        <span class="badge ${sc}">${sl}</span>
        ${ov?'<span class="badge badge-overdue">⚠ Overdue</span>':''}
        ${t.recurring?'<span class="badge badge-recurring">🔄 Daily</span>':''}
      </div>
    </div>
    <div class="task-bottom">
      ${m?`<div class="task-meta"><div class="avatar" style="width:16px;height:16px;font-size:7px;background:${m.color}14;color:${m.color};">${m.avatar}</div><span>${m.name}</span>${m.department?`<span class="dept-tag" style="padding:1px 5px;font-size:10px;">${m.department}</span>`:''}</div>`:''}
      <div class="task-meta">📌 ${fmt(t.createdAt)}</div>
      <div class="task-meta">📅 ${fmt(t.dueDate)}</div>
    </div>
  </div>`;
}

function showModal(){
  const ex=document.getElementById('mo');if(ex)ex.remove();
  const{type,data}=S.modal;let body='',title='',foot='';

  if(type==='add-member'||type==='edit-member'){
    const m=type==='edit-member'?S.members[data]:null;
    title=type==='edit-member'?'Edit Team Member':'Add Team Member';
    body=`<div class="form-row">
        <div class="form-group"><label class="form-label">Full Name</label><input class="form-input" id="m-nm" placeholder="Rahul Verma" value="${m?m.name:''}"></div>
        <div class="form-group"><label class="form-label">Department</label>
          <input class="form-input" id="m-dp" list="dpl" placeholder="Engineering..." value="${m&&m.department?m.department:''}">
          <datalist id="dpl">${[...new Set(mArr().map(x=>x.department).filter(Boolean))].map(d=>`<option value="${d}">`).join('')}</datalist>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Email Address</label><input class="form-input" id="m-em" type="email" placeholder="rahul@easysolutions.com" value="${m?m.email:''}"></div>
      <div class="form-group"><label class="form-label">Login Password</label>
        <input class="form-input" id="m-pw" type="text" placeholder="e.g. Rahul@123" value="${m?m.password:''}">
        <div class="form-hint">Share this password with the member so they can login.</div>
      </div>`;
    foot=`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="${type==='edit-member'?`updMember('${data}')`:'addMember()'}">${type==='edit-member'?'Save Changes':'Add Member'}</button>`;
  }
  else if(type==='view-creds'){
    const m=S.members[data];if(!m){closeModal();return;}
    title='🔑 Login Credentials';
    body=`<p style="font-size:12.5px;color:var(--muted);margin-bottom:12px;">Share these details with <strong style="color:var(--text)">${m.name}</strong></p>
      <div class="cred-box">
        <div class="cred-row"><span class="cred-label">🌐 URL</span><span class="cred-val">sittukumar95.github.io/easysolutions-tasks</span></div>
        <div class="cred-row"><span class="cred-label">📧 Email</span><span class="cred-val">${m.email}</span></div>
        <div class="cred-row"><span class="cred-label">🔒 Password</span><span class="cred-val">${m.password}</span></div>
        <div class="cred-row"><span class="cred-label">🏢 Department</span><span class="cred-val">${m.department||'—'}</span></div>
      </div>
      <button onclick="copyCreds('${m.name}','${m.email}','${m.password}')" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:12px;">📋 Copy to Clipboard</button>`;
    foot=`<button class="btn btn-ghost" onclick="closeModal()">Close</button>`;
  }
  else if(type==='add-task'||type==='assign-task'){
    const pre=type==='assign-task'?data:'';
    title='Create New Task';
    body=`<div class="form-group"><label class="form-label">Task Title</label><input class="form-input" id="t-ti" placeholder="e.g. Fix login bug"></div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-input" id="t-de" placeholder="Describe what needs to be done..."></textarea></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Assign To</label><select class="form-input" id="t-as"><option value="">Select member...</option>${mArr().map(m=>`<option value="${m.id}" ${m.id===pre?'selected':''}>${m.name}${m.department?' · '+m.department:''}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Priority</label><select class="form-input" id="t-pr"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="urgent">Urgent</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Due Date</label><input class="form-input" id="t-du" type="date"></div>
        <div class="form-group"><label class="form-label">Recurring Daily</label>
          <select class="form-input" id="t-rc"><option value="">No — one time</option><option value="yes">🔄 Yes — repeat daily</option></select>
          <div class="form-hint">Auto-carries to next day at midnight IST</div>
        </div>
      </div>`;
    foot=`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitTask()">Create Task</button>`;
  }
  else if(type==='view-task'){
    const t=S.tasks[data];if(!t){closeModal();return;}
    const m=S.members[t.assignedTo];
    const isMgr=S.user.role==='manager',isMine=S.user.id===t.assignedTo;
    const pc={'urgent':'badge-urgent','high':'badge-high','medium':'badge-medium','low':'badge-low'}[t.priority]||'badge-todo';
    const sc={'todo':'badge-todo','in-progress':'badge-progress','done':'badge-done'}[t.status]||'badge-todo';
    const ov=isOv(t);
    title=t.title;
    body=`<div class="flex gap-4 mb-12" style="flex-wrap:wrap;">
        <span class="badge ${pc}">${t.priority}</span>
        <span class="badge ${sc}">${t.status==='in-progress'?'In Progress':t.status==='done'?'Done':'To Do'}</span>
        ${ov?'<span class="badge badge-overdue">⚠ Overdue</span>':''}
        ${t.recurring?'<span class="badge badge-recurring">🔄 Daily Recurring</span>':''}
      </div>
      ${t.description?`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px;">${t.description}</div>`:''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;">
          <div class="form-label" style="margin-bottom:6px;">Assigned To</div>
          <div class="flex gap-8">${m?`<div class="avatar" style="width:22px;height:22px;font-size:8px;background:${m.color}14;color:${m.color};">${m.avatar}</div><div><div style="font-weight:600;font-size:13px;">${m.name}</div>${m.department?`<span class="dept-tag">${m.department}</span>`:''}</div>`:'—'}</div>
        </div>
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;">
          <div class="form-label" style="margin-bottom:6px;">Assigned Date</div>
          <div style="font-weight:600;font-size:13px;">📌 ${fmt(t.createdAt)}</div>
        </div>
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;">
          <div class="form-label" style="margin-bottom:6px;">Due Date</div>
          <div style="font-weight:600;font-size:13px;color:${ov?'#dc2626':'inherit'}">📅 ${fmt(t.dueDate)}</div>
        </div>
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;">
          <div class="form-label" style="margin-bottom:6px;">Priority</div>
          <span class="badge ${pc}">${t.priority}</span>
        </div>
      </div>
      ${(isMgr||isMine)?`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:12px;">
        <div class="form-label" style="margin-bottom:8px;">Update Status</div>
        <div class="flex gap-6" style="flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm ${t.status==='todo'?'btn-warn':''}" onclick="updStatus('${t.id}','todo')">📋 To Do</button>
          <button class="btn btn-ghost btn-sm ${t.status==='in-progress'?'btn-warn':''}" onclick="updStatus('${t.id}','in-progress')">⚡ In Progress</button>
          <button class="btn btn-ghost btn-sm ${t.status==='done'?'btn-success':''}" onclick="updStatus('${t.id}','done')">✅ Mark Done</button>
        </div>
      </div>`:''}`;
    foot=`${isMgr?`<button class="btn btn-info btn-sm" onclick="openModal('edit-task','${t.id}')">✏ Edit</button><button class="btn btn-danger btn-sm" onclick="delTask('${t.id}')">🗑 Delete</button>`:''}
          <button class="btn btn-ghost" onclick="closeModal()">Close</button>`;
  }
  else if(type==='edit-task'){
    const t=S.tasks[data];if(!t){closeModal();return;}
    title='Edit Task';
    body=`<div class="form-group"><label class="form-label">Title</label><input class="form-input" id="t-ti" value="${t.title}"></div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-input" id="t-de">${t.description||''}</textarea></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Assign To</label><select class="form-input" id="t-as">${mArr().map(m=>`<option value="${m.id}" ${m.id===t.assignedTo?'selected':''}>${m.name}${m.department?' · '+m.department:''}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-label">Priority</label><select class="form-input" id="t-pr"><option value="low" ${t.priority==='low'?'selected':''}>Low</option><option value="medium" ${t.priority==='medium'?'selected':''}>Medium</option><option value="high" ${t.priority==='high'?'selected':''}>High</option><option value="urgent" ${t.priority==='urgent'?'selected':''}>Urgent</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Due Date</label><input class="form-input" id="t-du" type="date" value="${t.dueDate||''}"></div>

    const a=type==='edit-ann'?S.anns[data]:null;
    title=type==='edit-ann'?'Edit Announcement':'Post Announcement';
    body=`<div class="form-group"><label class="form-label">Title</label><input class="form-input" id="a-ti" placeholder="e.g. Team meeting this Friday" value="${a?a.title:''}"></div>
      <div class="form-group"><label class="form-label">Message</label><textarea class="form-input" id="a-bo" placeholder="Write your announcement..." style="min-height:100px;">${a?a.body:''}</textarea></div>
      <div class="form-group"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2)"><input type="checkbox" id="a-pi" ${a&&a.pinned?'checked':''}> 📌 Pin this announcement at top</label></div>`;
    foot=`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="${type==='edit-ann'?`saveAnn('${data}')`:'postAnn()'}">${type==='edit-ann'?'Save Changes':'Post Announcement'}</button>`;
  }

  const ov=document.createElement('div');
  ov.className='modal-overlay';ov.id='mo';
  ov.innerHTML=`<div class="modal">
    <div class="modal-head"><span class="modal-title">${title}</span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${foot}</div>
  </div>`;
  ov.onclick=e=>{if(e.target===ov)closeModal();};
  document.body.appendChild(ov);
}

// ACTIONS
// ══════════════════════════════════════════════════════════════════
function openModal(type,data=''){S.modal={type,data};showModal();}
function closeModal(){S.modal=null;const o=document.getElementById('mo');if(o)o.remove();}
function setNav(nav){S.nav=nav;S.taskStatus='all';render();}
function bindNav(){document.querySelectorAll('[data-nav]').forEach(el=>{el.onclick=()=>setNav(el.dataset.nav);});}
function logout(){S.user=null;clearSession();render();}
function setStat(v){S.taskStatus=v;render();}
function setDateF(v){S.taskDate=v;if(v!=='custom')S.taskCustomDate='';render();}
function setCustomD(v){S.taskCustomDate=v;render();}
function setMemF(v){S.taskMember=v;render();}
function clearF(){S.taskStatus='all';S.taskDate='all';S.taskMember='all';S.taskCustomDate='';render();}
function setMQ(v){S.memberQ=v;render();setTimeout(()=>{const el=document.getElementById('mq-input');if(el){el.focus();el.setSelectionRange(v.length,v.length);}},30);}

function addMember(){
  const nm=document.getElementById('m-nm').value.trim();
  const em=document.getElementById('m-em').value.trim().toLowerCase();
  const pw=document.getElementById('m-pw').value.trim();
  const dp=document.getElementById('m-dp').value.trim();
  if(!nm||!em||!pw){toast('Please fill name, email and password','error');return;}
  if(mArr().find(m=>m.email.toLowerCase()===em)){toast('Email already exists','error');return;}
  const id='m'+Date.now();
  const av=nm.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  const color=COLORS[mArr().length%COLORS.length];
  db.ref('members/'+id).set({id,name:nm,email:em,password:pw,department:dp,avatar:av,color});
  toast(`${nm} added!`,'success');closeModal();
  setTimeout(()=>{S.modal={type:'view-creds',data:id};render();},400);
}
function updMember(id){
  const nm=document.getElementById('m-nm').value.trim();
  const em=document.getElementById('m-em').value.trim().toLowerCase();
  const pw=document.getElementById('m-pw').value.trim();
  const dp=document.getElementById('m-dp').value.trim();
  if(!nm||!em||!pw){toast('Please fill all fields','error');return;}
  if(mArr().find(x=>x.email.toLowerCase()===em&&x.id!==id)){toast('Email already used','error');return;}
  const av=nm.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  db.ref('members/'+id).update({name:nm,email:em,password:pw,department:dp,avatar:av});
  if(S.user&&S.user.id===id){S.user={...S.user,name:nm,email:em,password:pw,department:dp,avatar:av};saveSession(S.user);}
  toast('Member updated!','success');closeModal();
}
function delMember(id){if(!confirm('Remove this member?'))return;db.ref('members/'+id).remove();toast('Member removed','info');}
function copyCreds(nm,em,pw){
  const t=`Easy Solutions — Task Manager\n\nHello ${nm},\n\nYour login details:\n🌐 URL: https://sittukumar95.github.io/easysolutions-tasks\n📧 Email: ${em}\n🔒 Password: ${pw}\n\nPlease keep your password safe.`;
  navigator.clipboard.writeText(t).then(()=>toast(`Credentials copied for ${nm}!`,'success')).catch(()=>prompt('Copy this:',t));
}

async function submitTask(){
  const ti=document.getElementById('t-ti').value.trim();
  const de=document.getElementById('t-de').value.trim();
  const as=document.getElementById('t-as').value;
  const pr=document.getElementById('t-pr').value;
  const du=document.getElementById('t-du').value;
  const rc=document.getElementById('t-rc').value==='yes';
  if(!ti||!as){toast('Please fill title and assign to a member','error');return;}
  const id='t'+Date.now();
  await db.ref('tasks/'+id).set({id,title:ti,description:de,assignedTo:as,priority:pr,status:'todo',dueDate:du,createdAt:today(),recurring:rc});
  const m=S.members[as];
  if(m&&tgOk())await tg(`📋 <b>New Task Assigned</b>\n\n📌 <b>${ti}</b>\n👤 Assigned to: <b>${m.name}</b>${m.department?' ('+m.department+')':''}\n⚡ Priority: ${pr.toUpperCase()}\n📌 Assigned: ${fmt(today())}\n📅 Due: ${fmt(du)}\n${rc?'🔄 Recurring: Daily\n':''}\n${de?'📝 '+de:''}`);
  toast(`Task assigned to ${m?m.name:'member'}!`,'success');closeModal();
}
async function saveTask(id){
  const ti=document.getElementById('t-ti').value.trim();
  const de=document.getElementById('t-de').value.trim();
  const as=document.getElementById('t-as').value;
  const pr=document.getElementById('t-pr').value;
  const du=document.getElementById('t-du').value;
  const rc=document.getElementById('t-rc').value==='yes';
  await db.ref('tasks/'+id).update({title:ti,description:de,assignedTo:as,priority:pr,dueDate:du,recurring:rc});
  toast('Task updated!','success');closeModal();
}
async function delTask(id){if(!confirm('Delete this task?'))return;await db.ref('tasks/'+id).remove();toast('Task deleted','info');closeModal();}
async function updStatus(id,st){
  const t=S.tasks[id];
  await db.ref('tasks/'+id).update({status:st});
  if(t&&tgOk()){
    const m=S.members[t.assignedTo];
    const e=st==='done'?'✅':st==='in-progress'?'⚡':'📋';
    const sl=st==='in-progress'?'In Progress':st==='done'?'Done':'To Do';
    await tg(`${e} <b>Task Status Updated</b>\n\n📌 <b>${t.title}</b>\n👤 ${m?m.name:'—'}\n🔄 New Status: <b>${sl}</b>\n📌 Assigned: ${fmt(t.createdAt)}\n📅 Due: ${fmt(t.dueDate)}`);
  }
  toast(st==='done'?'Task marked done! ✅':'Status updated','success');closeModal();
}
async function postAnn(){
  const ti=document.getElementById('a-ti').value.trim();
  const bo=document.getElementById('a-bo').value.trim();
  const pi=document.getElementById('a-pi').checked;
  if(!ti||!bo){toast('Please fill all fields','error');return;}
  const id='a'+Date.now();
  await db.ref('announcements/'+id).set({id,title:ti,body:bo,pinned:pi,createdAt:today()});
  if(tgOk())await tg(`📢 <b>New Announcement</b>${pi?' 📌':''}\n\n<b>${ti}</b>\n\n${bo}`);
  toast('Announcement posted!','success');closeModal();
}
async function saveAnn(id){
  const ti=document.getElementById('a-ti').value.trim();
  const bo=document.getElementById('a-bo').value.trim();
  const pi=document.getElementById('a-pi').checked;
  await db.ref('announcements/'+id).update({title:ti,body:bo,pinned:pi});
  toast('Announcement updated!','success');closeModal();
}
async function delAnn(id){if(!confirm('Delete this announcement?'))return;await db.ref('announcements/'+id).remove();toast('Deleted','info');}

// ── PDF ───────────────────────────────────────────────────────────
function dlPDF(){
  const{jsPDF}=window.jspdf;const doc=new jsPDF();
  const p=S.rptPeriod,{from,to}=dateRange(p);
  const mems=S.rptMember==='all'?mArr():mArr().filter(m=>m.id===S.rptMember);
  const all=tArr();let y=20;
  doc.setFontSize(16);doc.setFont('helvetica','bold');doc.text('Easy Solutions — Work Report',20,y);y+=8;
  doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(130,110,60);
  doc.text(`Period: ${p.toUpperCase()} · ${from} to ${to} · Generated: ${today()}`,20,y);y+=8;
  doc.setTextColor(0,0,0);doc.line(20,y,190,y);y+=7;
  mems.forEach(m=>{
    const mt=all.filter(t=>t.assignedTo===m.id);
    const done=mt.filter(t=>t.status==='done').length,ov=mt.filter(t=>isOv(t)).length,pct=mt.length?Math.round(done/mt.length*100):0;
    if(y>245){doc.addPage();y=20;}
    doc.setFontSize(12);doc.setFont('helvetica','bold');doc.setTextColor(0,0,0);
    doc.text(`${m.name}${m.department?' ('+m.department+')':''}`,20,y);y+=6;
    doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.setTextColor(100,85,40);
    doc.text(`${m.email} · Completion: ${pct}% · Done: ${done}/${mt.length} · Overdue: ${ov}`,20,y);y+=6;
    doc.setTextColor(0,0,0);
    mt.forEach(t=>{
      if(y>270){doc.addPage();y=20;}
      doc.setFontSize(8);
      const s=t.status==='in-progress'?'In Progress':t.status==='done'?'Done':'Todo';
      doc.text(`  • ${t.title} [${s}] Assigned:${t.createdAt||'—'} Due:${t.dueDate||'—'}${isOv(t)?' OVERDUE':''}${t.recurring?' DAILY':''}`,22,y);y+=5;
    });
    y+=3;doc.line(20,y,190,y);y+=5;
  });
  doc.save(`EasySolutions-Report-${p}-${today()}.pdf`);
}
function dlMyPDF(){
  const{jsPDF}=window.jspdf;const doc=new jsPDF();
  const me=S.user,p=S.rptPeriod,{from,to}=dateRange(p);
  const myT=tArr().filter(t=>t.assignedTo===me.id);
  const done=myT.filter(t=>t.status==='done').length,ov=myT.filter(t=>isOv(t)).length,pct=myT.length?Math.round(done/myT.length*100):0;
  let y=20;
  doc.setFontSize(16);doc.setFont('helvetica','bold');doc.text('Easy Solutions — My Work Report',20,y);y+=8;
  doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(130,110,60);
  doc.text(`${me.name} · ${me.department||''} · ${p.toUpperCase()} · ${from} to ${to}`,20,y);y+=7;
  doc.setTextColor(0,0,0);doc.line(20,y,190,y);y+=6;
  doc.text(`Total: ${myT.length}  Done: ${done}  Active: ${myT.filter(t=>t.status==='in-progress').length}  Overdue: ${ov}  Rate: ${pct}%`,20,y);y+=8;
  doc.line(20,y,190,y);y+=6;
  myT.forEach(t=>{
    if(y>270){doc.addPage();y=20;}
    const s=t.status==='in-progress'?'In Progress':t.status==='done'?'Done':'Todo';
    doc.setFontSize(8.5);
    doc.text(`• ${t.title}  [${s}]  Assigned: ${t.createdAt||'—'}  Due: ${t.dueDate||'—'}${isOv(t)?' OVERDUE':''}${t.recurring?' DAILY':''}`,20,y);y+=6;
  });
  doc.save(`MyReport-${me.name.replace(/\s/g,'-')}-${p}-${today()}.pdf`);
}
