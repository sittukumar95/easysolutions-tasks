<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Solutions — Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0ede6;--surface:#fff;--surface2:#faf8f4;--surface3:#f5f0e8;
  --border:#e8e0d0;--border2:#d8ccb4;--text:#1a1610;--text2:#3a3020;
  --muted:#9a8c70;--accent:#e07808;--accent2:#f5a020;--gold:#f5a020;
  --dark:#1c180e;--dark2:#282010;
  --r:10px;--font:'Inter',sans-serif;
  --s1:0 1px 2px rgba(0,0,0,.05);
  --s2:0 1px 4px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04);
  --s3:0 4px 12px rgba(0,0,0,.10);
  --s4:0 8px 28px rgba(0,0,0,.12);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.app{display:flex;height:100vh;overflow:hidden;}

/* SIDEBAR */
.sb{width:220px;background:var(--dark);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
.sb-logo{height:60px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;}
.sb-logo img{width:32px;height:32px;object-fit:contain;border-radius:6px;flex-shrink:0;}
.sb-logo-name{font-family:'Montserrat',sans-serif;font-size:12.5px;font-weight:800;color:#f5a020;letter-spacing:.2px;line-height:1.2;}
.sb-logo-sub{font-size:8.5px;font-weight:600;color:rgba(245,160,32,.4);letter-spacing:1.8px;text-transform:uppercase;}
.sb-nav{padding:8px;flex:1;overflow-y:auto;}
.sb-nav::-webkit-scrollbar{width:0;}
.sb-sec{font-size:8.5px;font-weight:700;color:rgba(255,255,255,.2);letter-spacing:1.8px;text-transform:uppercase;padding:12px 8px 4px;}
.nb{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,.4);font-size:13px;font-weight:400;transition:all .15s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left;font-family:var(--font);position:relative;}
.nb:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.75);}
.nb.on{background:rgba(245,160,32,.12);color:#f5a020;font-weight:500;}
.nb.on::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:#f5a020;border-radius:0 2px 2px 0;}
.nb-ic{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
.nb-lb{flex:1;}
.nbadge{background:#e07808;color:#fff;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;}
.nbadge.r{background:#dc2626;}
.sb-foot{padding:10px;border-top:1px solid rgba(255,255,255,.06);}
.upill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.uname{font-size:12.5px;font-weight:500;color:rgba(255,255,255,.75);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.urole{font-size:10px;color:rgba(245,160,32,.5);display:flex;align-items:center;gap:3px;}
.sdot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.lob{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.2);font-size:14px;padding:3px;transition:color .15s;margin-left:auto;flex-shrink:0;}
.lob:hover{color:rgba(245,160,32,.6);}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{height:60px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:16px;box-shadow:var(--s1);}
.tb-l{display:flex;flex-direction:column;justify-content:center;}
.pt{font-size:16px;font-weight:700;color:var(--text);}
.ps{font-size:11.5px;color:var(--muted);margin-top:1px;}
.tb-r{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.content{flex:1;overflow-y:auto;padding:20px 24px;}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;font-family:var(--font);transition:all .15s;white-space:nowrap;line-height:1.4;}
.btn-p{background:linear-gradient(135deg,#f5a020,#e07808);color:#fff;box-shadow:0 2px 6px rgba(224,120,8,.3);}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(224,120,8,.4);}
.btn-g{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.btn-g:hover{background:var(--surface3);color:var(--text);border-color:var(--border2);}
.btn-d{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;}
.btn-d:hover{background:#fee2e2;}
.btn-s{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;}
.btn-w{background:#fffbeb;color:#d97706;border:1px solid #fde68a;}
.btn-i{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;}
.btn-tg{background:#e8f4fd;color:#0088cc;border:1px solid #bae6fd;}
.btn-pdf{background:#fef2f2;color:#dc2626;border:1px solid #fecada;}
.sm{padding:5px 10px;font-size:11.5px;}
.xs{padding:3px 8px;font-size:11px;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--s2);}
.ct{font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}

/* STAT CARDS */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--s2);position:relative;overflow:hidden;}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent2),var(--gold));}
.sc.bl::before{background:linear-gradient(90deg,#60a5fa,#3b82f6);}
.sc.gr::before{background:linear-gradient(90deg,#34d399,#10b981);}
.sc.re::before{background:linear-gradient(90deg,#f87171,#ef4444);}
.sv{font-size:28px;font-weight:800;font-family:'Montserrat',sans-serif;line-height:1;margin-top:10px;margin-bottom:4px;}
.sl{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}

/* BADGES */
.bdg{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;white-space:nowrap;}
.b-td{background:#f3f4f6;color:#6b7280;border:1px solid #e5e7eb;}
.b-ip{background:#fffbeb;color:#b45309;border:1px solid #fde68a;}
.b-dn{background:#f0fdf4;color:#15803d;border:1px solid #86efac;}
.b-ur{background:#fff1f2;color:#be123c;border:1px solid #fecdd3;}
.b-hi{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;}
.b-me{background:#fffbeb;color:#a16207;border:1px solid #fde68a;}
.b-lo{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;}
.b-ov{background:#fff1f2;color:#be123c;border:1px solid #fecdd3;}
.b-rc{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;}
.dtag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10.5px;font-weight:600;background:#fefce8;color:#854d0e;border:1px solid #fef08a;}

/* TASK ITEM */
.tl{display:flex;flex-direction:column;gap:6px;}
.ti{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:all .15s;box-shadow:var(--s1);}
.ti:hover{border-color:var(--accent2);box-shadow:var(--s3);transform:translateY(-1px);}
.ti.ov{border-left:3px solid #ef4444;padding-left:11px;}
.ti.rc{border-left:3px solid #3b82f6;padding-left:11px;}
.ti-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px;}
.ti-nm{font-size:13.5px;font-weight:600;color:var(--text);flex:1;line-height:1.4;}
.ti-bds{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0;align-items:center;}
.ti-bot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ti-mt{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);}

/* MEMBER CARD */
.mc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--s2);margin-bottom:8px;display:flex;align-items:flex-start;gap:14px;transition:all .15s;}
.mc:hover{box-shadow:var(--s3);border-color:var(--border2);}
.mi{flex:1;min-width:0;}
.mn{font-size:14px;font-weight:700;color:var(--text);}
.me{font-size:11.5px;color:var(--muted);margin-top:2px;}
.mba{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0;}
.mac{display:flex;flex-direction:column;gap:5px;flex-shrink:0;}
.pw{display:flex;align-items:center;gap:8px;}
.pb{flex:1;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;}
.pf{height:100%;border-radius:2px;transition:width .5s;}
.pp{font-size:11px;font-weight:600;color:var(--muted);flex-shrink:0;width:28px;text-align:right;}

/* ANNOUNCEMENT */
.ac{background:linear-gradient(135deg,#fffef7,#fffbeb);border:1px solid #fde68a;border-left:3px solid var(--accent2);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;}
.at{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.abg{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#92400e;background:#fef9c3;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;}
.atn{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:4px;}
.abo{font-size:12.5px;color:var(--text2);line-height:1.6;}
.atm{font-size:11px;color:var(--muted);margin-top:6px;}

/* FILTER SECTION */
.fs{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;box-shadow:var(--s1);}
.fr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.fl{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;flex-shrink:0;}
.fsel{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--text);font-family:var(--font);outline:none;cursor:pointer;transition:border-color .15s;}
.fsel:focus{border-color:var(--accent2);}
.fdiv{width:1px;height:18px;background:var(--border);flex-shrink:0;}

/* STATUS TABS */
.stabs{display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:8px;margin-bottom:14px;border:1px solid var(--border);}
.stab{flex:1;padding:6px 8px;border-radius:6px;border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s;text-align:center;}
.stab.on{background:var(--surface);color:var(--accent);box-shadow:var(--s1);border:1px solid var(--border);}

/* SEARCH */
.sbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:14px;transition:border-color .15s;box-shadow:var(--s1);}
.sbox:focus-within{border-color:var(--accent2);}
.sbox input{border:none;background:none;outline:none;font-size:13px;color:var(--text);font-family:var(--font);width:100%;}
.sbox input::placeholder{color:var(--muted);}
.xbtn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:13px;padding:0;line-height:1;}
.xbtn:hover{color:var(--text);}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(4px);}
.md{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:500px;max-height:90vh;overflow:hidden;box-shadow:var(--s4);display:flex;flex-direction:column;}
.mh{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.mt{font-size:15px;font-weight:700;color:var(--text);}
.mx{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:2px;transition:color .15s;}
.mx:hover{color:var(--text);}
.mb{padding:18px 20px;overflow-y:auto;flex:1;}
.mb::-webkit-scrollbar{width:3px;}
.mb::-webkit-scrollbar-thumb{background:var(--border2);}
.mf{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-shrink:0;background:var(--surface2);}

/* FORMS */
.fg{margin-bottom:14px;}
.fg:last-child{margin-bottom:0;}
.flb{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.6px;text-transform:uppercase;}
.fi{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:7px;padding:9px 12px;font-size:13.5px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .15s;}
.fi:focus{border-color:var(--accent2);background:#fff;}
.fi::placeholder{color:#c0b090;}
textarea.fi{resize:vertical;min-height:78px;}
select.fi{cursor:pointer;}
.fh{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.err{font-size:12px;color:#dc2626;font-weight:500;padding:4px 0;}

/* PROGRESS */
.pgbar{height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;}
.pgfill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--gold));border-radius:3px;transition:width .5s;}

/* CREDS */
.cb{background:#f0fdf4;border:1.5px solid #86efac;border-radius:var(--r);padding:14px;}
.cr{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #bbf7d0;gap:8px;}
.cr:last-child{border-bottom:none;}
.ck{font-size:12px;color:#15803d;font-weight:600;flex-shrink:0;}
.cv{font-family:'Courier New',monospace;font-size:11.5px;font-weight:700;color:#166534;background:#dcfce7;padding:2px 8px;border-radius:4px;word-break:break-all;}

/* REPORT */
.rph{background:linear-gradient(135deg,var(--dark),var(--dark2));border-radius:var(--r);padding:20px 22px;color:#fff;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
.rptabs{display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:8px;margin-bottom:14px;border:1px solid var(--border);}
.rtab{flex:1;padding:7px;border-radius:6px;border:none;background:none;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s;text-align:center;}
.rtab.on{background:var(--dark);color:#f5a020;box-shadow:var(--s1);}
.rm{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--s1);}
.rsg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0;}
.rs{text-align:center;padding:10px 6px;border-radius:7px;}
.rsv{font-size:20px;font-weight:800;font-family:'Montserrat',sans-serif;line-height:1;}
.rsl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:3px;}
.tr{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);gap:8px;}
.tr:last-child{border-bottom:none;}
.trn{font-size:12.5px;font-weight:500;color:var(--text);}
.trm{font-size:11px;color:var(--muted);margin-top:2px;}

/* TG */
.tgb{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;}
.tgon{background:#f0fdf4;color:#15803d;border:1px solid #86efac;}
.tgoff{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;}
.tgbox{background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--r);padding:12px 14px;margin-bottom:14px;}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--dark);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;z-index:9999;box-shadow:var(--s4);animation:su .3s ease;max-width:300px;display:flex;align-items:center;gap:8px;}
.toast.ok{border-left:3px solid #22c55e;}
.toast.er{border-left:3px solid #ef4444;}
.toast.in{border-left:3px solid #60a5fa;}
@keyframes su{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

/* LOGIN */
.lp{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fffef8,#fef5dc 45%,#fdf0c8);padding:24px;}
.lc{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px;box-shadow:var(--s4);}
.ll{text-align:center;margin-bottom:28px;}
.ll img{width:76px;height:76px;object-fit:contain;border-radius:12px;margin-bottom:10px;}
.ll h1{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:800;color:var(--accent);margin-bottom:2px;}
.ll p{font-size:12px;color:var(--muted);}

/* LOADING */
.ldp{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#fffef8,#fef5dc);gap:14px;}
.ldp img{width:68px;height:68px;object-fit:contain;border-radius:10px;}
.spin{width:26px;height:26px;border:2.5px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

/* MISC */
.div{height:1px;background:var(--border);margin:14px 0;}
.stt{font-size:13px;font-weight:700;color:var(--text);}
.es{text-align:center;padding:40px 20px;color:var(--muted);}
.ei{font-size:40px;margin-bottom:10px;}
.eh{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:4px;}
.ep{font-size:12.5px;line-height:1.5;}
.fx{display:flex;align-items:center;}
.fxb{display:flex;align-items:center;justify-content:space-between;}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}
.m6{margin-bottom:6px}.m8{margin-bottom:8px}.m10{margin-bottom:10px}.m12{margin-bottom:12px}.m14{margin-bottom:14px}.m16{margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
</style>
</head>
<body>

// Load TG config from Firebase on start
function loadTGFromFirebase() {
  db.ref('config/telegram').on('value', snap => {
    const cfg = snap.val() || {};
    TG_TOKEN = cfg.token || '';
    TG_CHAT  = cfg.chat  || '';
    // Re-render if loaded and app is ready
    if (S.ready) render();
  });
}
async function tg(msg) {
  if (!tgOk()) return;
  try {
    const r = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ chat_id: TG_CHAT, text: msg, parse_mode: 'HTML' })
    });
    const j = await r.json();
    if (!j.ok) console.warn('TG error:', j.description);
  } catch(e) { console.warn('TG fetch error:', e); }
}

// SESSION — stored in localStorage (per-device login state only)

// ═══════════════════════════════════════════════════════
function saveSession(u)  { try { localStorage.setItem('es_session', JSON.stringify(u)); } catch(e){} }
function loadSession()   { try { const s=localStorage.getItem('es_session'); return s?JSON.parse(s):null; } catch(e){return null;} }
function clearSession()  { try { localStorage.removeItem('es_session'); } catch(e){} }

const fmt   = d  => { if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y}`; };
const pLabel = s => s==='in-progress'?'In Progress':s==='done'?'Done':'To Do';
const pClass = p => ({urgent:'b-ur',high:'b-hi',medium:'b-me',low:'b-lo'}[p]||'b-td');
const sClass = s => ({todo:'b-td','in-progress':'b-ip',done:'b-dn'}[s]||'b-td');

function dateRange(p) {
  const n=new Date(); let f=new Date(n);
  if(p==='daily') f.setHours(0,0,0,0);
  else if(p==='weekly') f.setDate(n.getDate()-7);
  else if(p==='monthly') f=new Date(n.getFullYear(),n.getMonth(),1);
  return { from: f.toISOString().slice(0,10), to: n.toISOString().slice(0,10) };
}

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
function toast(msg, type='ok', ms=3200) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type==='ok'?'✓':type==='er'?'✕':'ℹ'}</span><span>${msg}</span>`;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, ms);
}

// ═══════════════════════════════════════════════════════
// FIREBASE LISTENERS — single source of truth for all data
// ═══════════════════════════════════════════════════════
function startFirebase() {
  let loaded = { m:false, t:false, a:false };

  function checkReady() {
    if (loaded.m && loaded.t && loaded.a && !S.ready) {
      S.ready = true;
      restoreSession();
      runRecurringCheck();
      render();
    }
  }

  // Members
  db.ref('members').on('value', snap => {
    S.data.members = snap.val() || {};
    loaded.m = true;
    if (S.ready) {
      // If logged in as member, refresh user from latest DB data
      if (S.user && S.user.role === 'member') {
        const fresh = S.data.members[S.user.id];
        if (fresh) { S.user = { role:'member', ...fresh }; saveSession(S.user); }
        else { S.user = null; clearSession(); }
      }
      render();
    } else checkReady();
  }, err => { console.error('FB members error:', err); toast('Firebase error — check rules','er'); });

  db.ref('tasks').on('value', snap => {
    S.data.tasks = snap.val() || {};
    loaded.t = true;
    if (S.ready) { runRecurringCheck(); render(); }
    else checkReady();
  }, err => console.error('FB tasks error:', err));

  db.ref('announcements').on('value', snap => {
    S.data.anns = snap.val() || {};
    loaded.a = true;
    if (S.ready) render();
    else checkReady();
  }, err => console.error('FB anns error:', err));
}

// ═══════════════════════════════════════════════════════
// SESSION RESTORE
// ═══════════════════════════════════════════════════════
function restoreSession() {
  const saved = loadSession();
  if (!saved) return;
  if (saved.role === 'manager') {
    S.user = saved;
    S.nav  = 'dashboard';
  } else {
    // Always re-validate member against live Firebase data
    const fresh = S.data.members[saved.id];
    if (fresh && fresh.password === saved.password) {
      S.user = { role:'member', ...fresh };
      S.nav  = 'my-tasks';
      saveSession(S.user); // update session with fresh data
    } else {
      clearSession(); // credentials changed or member deleted
    }
  }
}

// ═══════════════════════════════════════════════════════
// RECURRING TASK AUTO-CARRY
// ═══════════════════════════════════════════════════════
function runRecurringCheck() {
  const td  = today();
  const key = 'es_rc_' + td; // one check per calendar day
  if (localStorage.getItem(key)) return;
  localStorage.setItem(key, '1');
  // Clean old keys
  for (let k in localStorage) { if (k.startsWith('es_rc_') && k !== key) localStorage.removeItem(k); }

  tArr().filter(t => t.recurring && t.status !== 'done').forEach(t => {
    if (!t.dueDate || t.dueDate >= td) return; // not past due yet
    const alreadyExists = tArr().some(x => x.recurringParentId === t.id && x.dueDate === td);
    if (alreadyExists) return;
    // Create new task for today
    const nid = 'rc_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
    db.ref('tasks/' + nid).set({
      id: nid, title: t.title, description: t.description,
      assignedTo: t.assignedTo, priority: t.priority,
      status: 'todo', dueDate: td, createdAt: td,
      recurring: true, recurringParentId: t.id
    });
    db.ref('tasks/' + t.id).update({ status: 'done' });
    const m = S.data.members[t.assignedTo];
    if (m) tg(`🔄 <b>Daily Task Renewed</b>\n\n📋 <b>${t.title}</b>\n👤 ${m.name}${m.department?' ('+m.department+')':''}\n📅 Date: ${fmt(td)}\n⚡ Priority: ${t.priority}`);
  });
}

  S.user = u; saveSession(u); S.nav = 'my-tasks'; render();
}

// ═══════════════════════════════════════════════════════
// ALL TASKS
// ═══════════════════════════════════════════════════════
function renderAllTasks() {
  let fil = tArr();
  const td = today();
  if (S.tsf !== 'all') fil = fil.filter(t => t.status === S.tsf);
  if      (S.tdf === 'today')  fil = fil.filter(t => t.dueDate === td);
  else if (S.tdf === 'overdue')fil = fil.filter(t => isOv(t));
  else if (S.tdf === 'week')   { const w=new Date(); w.setDate(w.getDate()-7); fil=fil.filter(t=>t.dueDate>=w.toISOString().slice(0,10)&&t.dueDate<=td); }
  else if (S.tdf === 'custom' && S.tcd) fil = fil.filter(t => t.dueDate === S.tcd);
  if (S.tmf !== 'all') fil = fil.filter(t => t.assignedTo === S.tmf);
  // Sort: urgent first, then by due date
  fil.sort((a,b) => {
    const po={urgent:0,high:1,medium:2,low:3};
    const pd=(po[a.priority]||4)-(po[b.priority]||4);
    if(pd!==0)return pd;
    return (a.dueDate||'9999')>(b.dueDate||'9999')?1:-1;
  });
  const hasF = S.tsf!=='all'||S.tdf!=='all'||S.tmf!=='all';
  return `<div class="topbar">
    <div class="tb-l"><div class="pt">All Tasks</div><div class="ps">${fil.length} of ${tArr().length} tasks shown</div></div>
    <div class="tb-r"><button class="btn btn-p" onclick="openModal('add-task')">＋ New Task</button></div>
  </div>
  <div class="content">
    <div class="stabs">
      ${['all','todo','in-progress','done'].map(s=>`<button class="stab ${S.tsf===s?'on':''}" onclick="setSF('${s}')">${s==='all'?'All Tasks':s==='in-progress'?'In Progress':s.charAt(0).toUpperCase()+s.slice(1)}</button>`).join('')}
    </div>
    <div class="fs">
      <div class="fr">
        <span class="fl">Filter:</span>
        <select class="fsel" onchange="setDF(this.value)">
          <option value="all"    ${S.tdf==='all'?'selected':''}>📅 All Dates</option>
          <option value="today"  ${S.tdf==='today'?'selected':''}>📌 Today</option>
          <option value="overdue"${S.tdf==='overdue'?'selected':''}>🔴 Overdue</option>
          <option value="week"   ${S.tdf==='week'?'selected':''}>📆 This Week</option>
          <option value="custom" ${S.tdf==='custom'?'selected':''}>🗓 Custom Date</option>
        </select>
        ${S.tdf==='custom'?`<input type="date" class="fsel" value="${S.tcd}" onchange="setCD(this.value)" style="cursor:pointer;">`:''}
        <div class="fdiv"></div>
        <select class="fsel" onchange="setMF(this.value)">
          <option value="all">👥 All Members</option>
          ${mArr().map(m=>`<option value="${m.id}" ${S.tmf===m.id?'selected':''}>${m.name}${m.department?' · '+m.department:''}</option>`).join('')}
        </select>
        ${hasF?`<div class="fdiv"></div><button class="btn btn-g sm" onclick="clearF()">✕ Clear All</button>`:''}
      </div>
    </div>
    ${fil.length===0?`<div class="es"><div class="ei">📭</div><div class="eh">No tasks match</div><div class="ep">Adjust filters or create a new task.</div></div>`:`<div class="tl">${fil.map(t=>taskRow(t,true)).join('')}</div>`}
  </div>`;
}

  const t=document.getElementById('tg-t').value.trim();

  db.ref('config/telegram').set({token:t,chat:c})

              <span class="bdg ${sClass(t.status)}">${pLabel(t.status)}</span>
              ${isOv(t)?'<span class="bdg b-ov">⚠</span>':''}
            </div>
          </div>`).join('')}`:`<div style="color:var(--muted);font-size:12.5px;">No tasks assigned.</div>`}
        </div>`;
      }).join('')}
  </div>`;
}

function renderMemApp() {

  return `<div class="app">
    <aside class="sb">
      <div class="sb-logo"><img src="${LOGO}"><div><div class="sb-logo-name">Easy Solutions</div><div class="sb-logo-sub">Task Manager</div></div></div>
      <nav class="sb-nav">
        <div class="sb-sec">My Work</div>
        <button class="nb ${n==='my-tasks'?'on':''}" data-nav="my-tasks"><span class="nb-ic">✅</span><span class="nb-lb">My Tasks</span>${pend?`<span class="nbadge">${pend}</span>`:''}</button>
        <button class="nb ${n==='my-report'?'on':''}" data-nav="my-report"><span class="nb-ic">📈</span><span class="nb-lb">My Report</span>${ov?`<span class="nbadge r">${ov}</span>`:''}</button>
        <div class="sb-sec">Team</div>

function renderMyTasks() {
  const me=S.user, myT=tArr().filter(t=>t.assignedTo===me.id);
  const f=S.tsf, fil=f==='all'?myT:myT.filter(t=>t.status===f);
  const dn=myT.filter(t=>t.status==='done').length, pct=myT.length?Math.round(dn/myT.length*100):0, ov=myT.filter(t=>isOv(t)).length;
  return `<div class="topbar">
    <div class="tb-l"><div class="pt">My Tasks</div><div class="ps">${myT.length} assigned · ${pct}% complete${ov?` · ⚠ ${ov} overdue`:''}</div></div>
  </div>
  <div class="content">
    <div class="g3 m16">
      <div class="sc"><div class="sl">To Do</div><div class="sv" style="color:var(--muted)">${myT.filter(t=>t.status==='todo').length}</div></div>
      <div class="sc"><div class="sl">In Progress</div><div class="sv" style="color:var(--accent)">${myT.filter(t=>t.status==='in-progress').length}</div></div>
      <div class="sc gr"><div class="sl">Completed</div><div class="sv" style="color:#10b981">${dn}</div></div>
    </div>
    <div class="card m14">
      <div class="fxb m8"><span style="font-size:13px;font-weight:600;">Completion Rate</span><span style="font-size:16px;font-weight:800;font-family:'Montserrat',sans-serif;color:${pct>=70?'#10b981':pct>=40?'#d97706':'#ef4444'}">${pct}%</span></div>
      <div class="pgbar" style="height:7px;"><div class="pgfill" style="width:${pct}%"></div></div>
    </div>
    <div class="stabs">${['all','todo','in-progress','done'].map(s=>`<button class="stab ${f===s?'on':''}" onclick="setSF('${s}')">${s==='all'?'All':s==='in-progress'?'In Progress':s.charAt(0).toUpperCase()+s.slice(1)}</button>`).join('')}</div>
    ${fil.length===0?`<div class="es"><div class="ei">🎉</div><div class="eh">All clear!</div><div class="ep">No tasks in this category.</div></div>`:`<div class="tl">${fil.map(t=>taskRow(t,false)).join('')}</div>`}
  </div>`;
}

function renderMemAnns() {
  const anns=aArr();
  return `<div class="topbar"><div class="tb-l"><div class="pt">Announcements</div><div class="ps">Messages from your manager</div></div></div>
  <div class="content">

      anns.map(a=>`<div class="ac"><div class="at"><span class="abg">📢 ${a.pinned?'📌 Pinned':'Notice'}</span></div>

        <div class="atm">Posted: ${fmt(a.createdAt)}</div>
      </div>`).join('')}
  </div>`;
}

          <div><div class="trn">${t.title}${t.recurring?` <span class="bdg b-rc" style="font-size:9px;">🔄</span>`:''}</div>

          <div class="fx g4">
            <span class="bdg ${sClass(t.status)}">${pLabel(t.status)}</span>
            ${isOv(t)?'<span class="bdg b-ov">⚠</span>':''}
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

  const {type, data} = S.modal;
  let title='', body='', foot='';

  if (type==='add-member'||type==='edit-member') {
    const m = type==='edit-member' ? S.data.members[data] : null;
    title = type==='edit-member' ? 'Edit Team Member' : 'Add Team Member';
    body = `<div class="fr2">
      <div class="fg"><label class="flb">Full Name</label><input class="fi" id="m-nm" placeholder="Rahul Verma" value="${m?m.name:''}"></div>
      <div class="fg"><label class="flb">Department</label>
        <input class="fi" id="m-dp" list="dpl" placeholder="Engineering..." value="${m&&m.department?m.department:''}">

    <div class="fg"><label class="flb">Email Address</label><input class="fi" id="m-em" type="email" placeholder="rahul@easysolutions.com" value="${m?m.email:''}"></div>

    </div>`;

    body = `<p style="font-size:12.5px;color:var(--muted);margin-bottom:12px;">Share with <strong style="color:var(--text)">${m.name}</strong> — works on any device or browser.</p>

    foot = `<button class="btn btn-g" onclick="closeModal()">Close</button>`;
  }

  else if (type==='add-task'||type==='assign-task') {
    const pre = type==='assign-task' ? data : '';
    title = 'Create New Task';
    body = `<div class="fg"><label class="flb">Task Title</label><input class="fi" id="t-ti" placeholder="e.g. Fix login bug on mobile"></div>
      <div class="fg"><label class="flb">Description</label><textarea class="fi" id="t-de" placeholder="Describe what needs to be done..."></textarea></div>
      <div class="fr2">
        <div class="fg"><label class="flb">Assign To</label>
          <select class="fi" id="t-as"><option value="">Select member...</option>

          </select>
        </div>
        <div class="fg"><label class="flb">Priority</label>
          <select class="fi" id="t-pr"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="urgent">Urgent</option></select>
        </div>
      </div>

        <div class="fg"><label class="flb">Due Date</label><input class="fi" id="t-du" type="date"></div>
        <div class="fg"><label class="flb">Recurring Daily</label>
          <select class="fi" id="t-rc"><option value="">No — one time task</option><option value="yes">🔄 Yes — repeat daily</option></select>
          <div class="fh">Auto-carries to next day at midnight IST</div>
        </div>
      </div>`;
    foot = `<button class="btn btn-g" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="submitTask()">Create Task</button>`;
  }

  else if (type==='view-task') {
    const t = S.data.tasks[data]; if(!t){closeModal();return;}
    const m    = S.data.members[t.assignedTo];
    const isMgr = S.user.role==='manager';
    const isMine = S.user.id===t.assignedTo;
    const ov   = isOv(t);
    title = t.title;
    body = `<div class="fx g4 m12" style="flex-wrap:wrap;">
        <span class="bdg ${pClass(t.priority)}">${t.priority}</span>
        <span class="bdg ${sClass(t.status)}">${pLabel(t.status)}</span>
        ${ov?'<span class="bdg b-ov">⚠ Overdue</span>':''}
        ${t.recurring?'<span class="bdg b-rc">🔄 Daily Recurring</span>':''}
      </div>
      ${t.description?`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px;">${t.description}</div>`:''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;">
          <div class="flb" style="margin-bottom:5px;">Assigned To</div>
          <div class="fx g8">${m?`<div class="av" style="width:22px;height:22px;font-size:8px;background:${m.color}14;color:${m.color};">${m.avatar}</div><div><div style="font-weight:600;font-size:13px;">${m.name}</div>${m.department?`<span class="dtag">${m.department}</span>`:''}</div>`:'—'}</div>

        </div>

        </div>
      </div>
      ${(isMgr||isMine)?`<div style="background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:12px;">
        <div class="flb" style="margin-bottom:8px;">Update Status</div>
        <div class="fx g6" style="flex-wrap:wrap;">
          <button class="btn sm ${t.status==='todo'?'btn-w':'btn-g'}" onclick="updStatus('${t.id}','todo')">📋 To Do</button>
          <button class="btn sm ${t.status==='in-progress'?'btn-w':'btn-g'}" onclick="updStatus('${t.id}','in-progress')">⚡ In Progress</button>
          <button class="btn sm ${t.status==='done'?'btn-s':'btn-g'}" onclick="updStatus('${t.id}','done')">✅ Mark Done</button>
        </div>
      </div>`:''}`;
    foot = `${isMgr?`<button class="btn btn-i sm" onclick="openModal('edit-task','${t.id}')">✏ Edit</button><button class="btn btn-d sm" onclick="delTask('${t.id}')">🗑 Delete</button>`:''}<button class="btn btn-g" onclick="closeModal()">Close</button>`;
  }

  else if (type==='edit-task') {
    const t = S.data.tasks[data]; if(!t){closeModal();return;}
    title = 'Edit Task';
    body = `<div class="fg"><label class="flb">Title</label><input class="fi" id="t-ti" value="${t.title.replace(/"/g,'&quot;')}"></div>
      <div class="fg"><label class="flb">Description</label><textarea class="fi" id="t-de">${t.description||''}</textarea></div>
      <div class="fr2">
        <div class="fg"><label class="flb">Assign To</label><select class="fi" id="t-as">
          ${mArr().map(m=>`<option value="${m.id}" ${m.id===t.assignedTo?'selected':''}>${m.name}${m.department?' · '+m.department:''}</option>`).join('')}
        </select></div>
        <div class="fg"><label class="flb">Priority</label><select class="fi" id="t-pr">
          <option value="low" ${t.priority==='low'?'selected':''}>Low</option>
          <option value="medium" ${t.priority==='medium'?'selected':''}>Medium</option>
          <option value="high" ${t.priority==='high'?'selected':''}>High</option>
          <option value="urgent" ${t.priority==='urgent'?'selected':''}>Urgent</option>
        </select></div>
      </div>
      <div class="fr2">
        <div class="fg"><label class="flb">Due Date</label><input class="fi" id="t-du" type="date" value="${t.dueDate||''}"></div>
        <div class="fg"><label class="flb">Recurring Daily</label><select class="fi" id="t-rc">
          <option value="" ${!t.recurring?'selected':''}>No — one time</option>
          <option value="yes" ${t.recurring?'selected':''}>🔄 Yes — daily</option>
        </select></div>
      </div>`;
    foot = `<button class="btn btn-g" onclick="closeModal()">Cancel</button><button class="btn btn-p" onclick="saveTask('${t.id}')">Save Changes</button>`;
  }

  else if (type==='add-ann'||type==='edit-ann') {
    const a = type==='edit-ann' ? S.data.anns[data] : null;
    title = type==='edit-ann' ? 'Edit Announcement' : 'Post Announcement';
    body = `<div class="fg"><label class="flb">Title</label><input class="fi" id="a-ti" placeholder="e.g. Team meeting this Friday" value="${a?a.title.replace(/"/g,'&quot;'):''}"></div>
      <div class="fg"><label class="flb">Message</label><textarea class="fi" id="a-bo" placeholder="Write your announcement..." style="min-height:100px;">${a?a.body:''}</textarea></div>
      <div class="fg"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2)"><input type="checkbox" id="a-pi" ${a&&a.pinned?'checked':''}> 📌 Pin this announcement at top</label></div>`;
    foot = `<button class="btn btn-g" onclick="closeModal()">Cancel</button>
            <button class="btn btn-p" onclick="${type==='edit-ann'?`saveAnn('${data}')`:'postAnn()'}">${type==='edit-ann'?'Save Changes':'Post Announcement'}</button>`;
  }

  const wrap = document.createElement('div');
  wrap.id = 'modal-root';
  wrap.className = 'mo';
  wrap.innerHTML = `<div class="md">
    <div class="mh"><span class="mt">${title}</span><button class="mx" onclick="closeModal()">✕</button></div>
    <div class="mb">${body}</div>
    <div class="mf">${foot}</div>
  </div>`;
  wrap.onclick = e => { if(e.target===wrap) closeModal(); };
  document.body.appendChild(wrap);
}

function openModal(type,data=''){S.modal={type,data};buildModal();}
function closeModal(){S.modal=null;const o=document.getElementById('modal-root');if(o)o.remove();}
function setNav(n){S.nav=n;S.tsf='all';render();}
function bindNav(){document.querySelectorAll('[data-nav]').forEach(el=>{el.onclick=()=>setNav(el.dataset.nav);});}
function logout(){S.user=null;clearSession();render();}
function setSF(v){S.tsf=v;render();}
function setDF(v){S.tdf=v;if(v!=='custom')S.tcd='';render();}
function setCD(v){S.tcd=v;render();}
function setMF(v){S.tmf=v;render();}
function clearF(){S.tsf='all';S.tdf='all';S.tmf='all';S.tcd='';render();}
function setMQ(v){S.msq=v;render();setTimeout(()=>{const el=document.getElementById('mq-inp');if(el){el.focus();el.setSelectionRange(v.length,v.length);}},30);}

// ─── Member CRUD ─────────────────────────────────────────────────
function addMember() {
  const nm=document.getElementById('m-nm').value.trim();
  const em=document.getElementById('m-em').value.trim().toLowerCase();
  const pw=document.getElementById('m-pw').value.trim();
  const dp=document.getElementById('m-dp').value.trim();
  if(!nm||!em||!pw){toast('Fill in name, email and password','er');return;}
  if(!em.includes('@')){toast('Enter a valid email address','er');return;}
  if(pw.length<4){toast('Password must be at least 4 characters','er');return;}
  if(mArr().find(m=>m.email.toLowerCase()===em)){toast('This email already exists','er');return;}
  const id='m'+Date.now();
  const av=nm.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  const color=COLORS[mArr().length%COLORS.length];
  db.ref('members/'+id).set({id,name:nm,email:em,password:pw,department:dp,avatar:av,color})
    .then(()=>{
      toast(`${nm} added!`,'ok');
      closeModal();

function updMember(id) {
  const nm=document.getElementById('m-nm').value.trim();
  const em=document.getElementById('m-em').value.trim().toLowerCase();
  const pw=document.getElementById('m-pw').value.trim();
  const dp=document.getElementById('m-dp').value.trim();
  if(!nm||!em||!pw){toast('Fill in all fields','er');return;}
  if(!em.includes('@')){toast('Enter a valid email address','er');return;}
  if(pw.length<4){toast('Password must be at least 4 characters','er');return;}
  if(mArr().find(x=>x.email.toLowerCase()===em&&x.id!==id)){toast('Email already used by another member','er');return;}
  const av=nm.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  db.ref('members/'+id).update({name:nm,email:em,password:pw,department:dp,avatar:av})
    .then(()=>{
      // If editing self, update session too
      if(S.user&&S.user.id===id){S.user={...S.user,name:nm,email:em,password:pw,department:dp,avatar:av};saveSession(S.user);}
      toast('Member updated!','ok');closeModal();
    }).catch(e=>{toast('Update failed — check Firebase rules','er');console.error(e);});
}

function delMember(id) {
  if(!confirm('Remove this member? Their tasks will remain.'))return;
  db.ref('members/'+id).remove()
    .then(()=>toast('Member removed','in'))
    .catch(e=>{toast('Delete failed — check Firebase rules','er');console.error(e);});
}

function copyCreds(nm,em,pw) {
  const txt=`Easy Solutions — Task Manager\n\nHello ${nm},\n\nYour login credentials:\n🌐 URL: https://sittukumar95.github.io/easysolutions-tasks\n📧 Email: ${em}\n🔒 Password: ${pw}\n\nWorks on any device or browser. Keep your password safe!`;

async function submitTask() {
  const ti=document.getElementById('t-ti').value.trim();
  const de=document.getElementById('t-de').value.trim();
  const as=document.getElementById('t-as').value;
  const pr=document.getElementById('t-pr').value;
  const du=document.getElementById('t-du').value;
  const rc=document.getElementById('t-rc').value==='yes';
  if(!ti){toast('Enter a task title','er');return;}
  if(!as){toast('Assign the task to a member','er');return;}
  const id='t'+Date.now();
  try {
    await db.ref('tasks/'+id).set({id,title:ti,description:de,assignedTo:as,priority:pr,status:'todo',dueDate:du,createdAt:today(),recurring:rc});
    const m=S.data.members[as];
    if(m&&tgOk()) await tg(`📋 <b>New Task Assigned</b>\n\n📌 <b>${ti}</b>\n👤 Assigned to: <b>${m.name}</b>${m.department?' ('+m.department+')':''}\n⚡ Priority: ${pr.toUpperCase()}\n📌 Assigned: ${fmt(today())}\n📅 Due: ${fmt(du)}\n${rc?'🔄 Recurring: Daily\n':''}\n${de?'📝 '+de:''}`);
    toast(`Task assigned to ${m?m.name:'member'}!`,'ok');
    closeModal();
  } catch(e){toast('Save failed — check Firebase rules','er');console.error(e);}
}

      await tg(`${em} <b>Task Status Updated</b>\n\n📌 <b>${t.title}</b>\n👤 ${m?m.name:'—'}\n🔄 New Status: <b>${pLabel(st)}</b>\n📌 Assigned: ${fmt(t.createdAt)}\n📅 Due: ${fmt(t.dueDate)}`);

}

function dlPDF() {
  const {jsPDF}=window.jspdf; const doc=new jsPDF();
  const p=S.rpp, {from,to}=dateRange(p);
  const mems=S.rpm==='all'?mArr():mArr().filter(m=>m.id===S.rpm);
  const all=tArr(); let y=20;
  doc.setFontSize(16);doc.setFont('helvetica','bold');
  doc.text('Easy Solutions — Work Report',20,y);y+=8;
  doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(130,110,60);
  doc.text(`Period: ${p.toUpperCase()} · ${from} to ${to} · Generated: ${today()}`,20,y);y+=8;
  doc.setTextColor(0,0,0);doc.line(20,y,190,y);y+=7;
  mems.forEach(m=>{
    const mt=all.filter(t=>t.assignedTo===m.id);
    const dn=mt.filter(t=>t.status==='done').length, ov=mt.filter(t=>isOv(t)).length;
    const pct=mt.length?Math.round(dn/mt.length*100):0;
    if(y>245){doc.addPage();y=20;}
    doc.setFontSize(12);doc.setFont('helvetica','bold');doc.setTextColor(0,0,0);
    doc.text(`${m.name}${m.department?' ('+m.department+')':''}`,20,y);y+=6;
    doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.setTextColor(100,85,40);
    doc.text(`${m.email} · Completion: ${pct}% · Done: ${dn}/${mt.length} · Overdue: ${ov}`,20,y);y+=6;
    doc.setTextColor(0,0,0);
    mt.forEach(t=>{
      if(y>270){doc.addPage();y=20;}
      doc.setFontSize(8);
      const s=pLabel(t.status);
      doc.text(`  • ${t.title} [${s}] Assigned:${t.createdAt||'—'} Due:${t.dueDate||'—'}${isOv(t)?' OVERDUE':''}${t.recurring?' DAILY':''}`,22,y);y+=5;
    });
    y+=3;doc.line(20,y,190,y);y+=5;
  });
  doc.save(`EasySolutions-${p}-Report-${today()}.pdf`);
}

function dlMyPDF() {
  const {jsPDF}=window.jspdf; const doc=new jsPDF();
  const me=S.user, p=S.rpp, {from,to}=dateRange(p);
  const myT=tArr().filter(t=>t.assignedTo===me.id);
  const dn=myT.filter(t=>t.status==='done').length, ov=myT.filter(t=>isOv(t)).length;
  const pct=myT.length?Math.round(dn/myT.length*100):0;
  let y=20;
  doc.setFontSize(16);doc.setFont('helvetica','bold');
  doc.text('Easy Solutions — My Work Report',20,y);y+=8;
  doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(130,110,60);
  doc.text(`${me.name} · ${me.department||''} · ${p.toUpperCase()} · ${from} to ${to}`,20,y);y+=7;
  doc.setTextColor(0,0,0);doc.line(20,y,190,y);y+=6;
  doc.text(`Total:${myT.length}  Done:${dn}  Active:${myT.filter(t=>t.status==='in-progress').length}  Overdue:${ov}  Rate:${pct}%`,20,y);y+=8;
  doc.line(20,y,190,y);y+=6;
  myT.forEach(t=>{
    if(y>270){doc.addPage();y=20;}
    doc.setFontSize(8.5);

}
