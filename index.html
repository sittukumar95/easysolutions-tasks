<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Solutions — Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#fafaf8;--surface:#fff;--surface2:#fef9f0;--surface3:#fdf3dc;
--border:#f0e8d0;--border2:#e8d8a8;--text:#1a1608;--text2:#3d3010;
--muted:#8a7a50;--accent:#e8850a;--accent2:#f5a623;
--gold1:#fbbf24;--gold2:#f59e0b;--gold3:#d97706;--gold4:#b45309;
--dark:#1a1608;--radius:12px;--font:'Inter',sans-serif;
--shadow:0 1px 4px rgba(180,130,0,.1);--shadow-lg:0 4px 20px rgba(180,130,0,.15);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:230px;background:var(--dark);display:flex;flex-direction:column;flex-shrink:0;position:relative;overflow:hidden;}
.sidebar::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(245,166,35,.12) 0%,transparent 70%);pointer-events:none;}
.logo{padding:18px 16px;border-bottom:1px solid rgba(245,166,35,.15);display:flex;align-items:center;gap:10px;}
.logo img{width:40px;height:40px;object-fit:contain;flex-shrink:0;}
.logo-name{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800;color:#f5a623;letter-spacing:.5px;}
.logo-sub{font-size:9px;font-weight:600;color:rgba(245,166,35,.5);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
.nav{padding:14px 10px;flex:1;overflow-y:auto;}
.nav-section{font-size:9px;font-weight:700;color:rgba(245,166,35,.4);letter-spacing:1.5px;text-transform:uppercase;padding:8px 10px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,.5);font-size:13px;font-weight:400;transition:all .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:var(--font);}
.nav-item:hover{background:rgba(245,166,35,.1);color:rgba(255,255,255,.85);}
.nav-item.active{background:linear-gradient(135deg,rgba(245,166,35,.2),rgba(232,133,10,.15));color:#f5a623;font-weight:500;border:1px solid rgba(245,166,35,.2);}
.nav-item .icon{font-size:15px;width:18px;text-align:center;}
.nav-badge{margin-left:auto;background:var(--accent);color:white;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:700;}
.sidebar-bottom{padding:12px;border-top:1px solid rgba(245,166,35,.12);}
.user-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.12);}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.user-info{flex:1;min-width:0;}
.user-name{font-size:13px;font-weight:500;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role{font-size:10px;color:rgba(245,166,35,.6);}
.logout-btn{background:none;border:none;cursor:pointer;color:rgba(245,166,35,.5);font-size:16px;}
.logout-btn:hover{color:var(--accent2);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);box-shadow:var(--shadow);flex-shrink:0;}
.page-title{font-size:18px;font-weight:700;}
.page-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:var(--font);transition:all .15s;}
.btn-primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:white;box-shadow:0 2px 8px rgba(232,133,10,.3);}
.btn-primary:hover{box-shadow:0 4px 14px rgba(232,133,10,.4);transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2);font-weight:500;}
.btn-ghost:hover{background:var(--surface2);color:var(--text);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-danger{background:rgba(239,68,68,.08);color:#dc2626;border:1px solid rgba(239,68,68,.2);}
.btn-success{background:rgba(34,197,94,.08);color:#16a34a;border:1px solid rgba(34,197,94,.2);}
.btn-warn{background:rgba(245,166,35,.1);color:var(--gold3);border:1px solid rgba(245,166,35,.25);}
.btn-info{background:rgba(59,130,246,.08);color:#2563eb;border:1px solid rgba(59,130,246,.2);}
.content{flex:1;overflow-y:auto;padding:24px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.card-sm{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.stat-value{font-size:30px;font-weight:800;font-family:'Montserrat',sans-serif;margin-bottom:4px;}
.stat-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
.stat-stripe{height:3px;background:linear-gradient(90deg,var(--accent2),var(--gold1));border-radius:3px;margin-bottom:14px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-todo{background:#f5f5f0;color:#8a7a50;border:1px solid #e8e0c8;}
.badge-progress{background:#fff7e6;color:#d97706;border:1px solid #fcd34d;}
.badge-done{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;}
.badge-urgent{background:#fff1f0;color:#dc2626;border:1px solid #fecaca;}
.badge-high{background:#fff7e6;color:#b45309;border:1px solid #fde68a;}
.badge-medium{background:#fffbeb;color:#d97706;border:1px solid #fde68a;}
.badge-low{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;}
.task-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:8px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow);}
.task-item:hover{border-color:var(--accent2);box-shadow:0 3px 12px rgba(232,133,10,.12);transform:translateY(-1px);}
.task-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.task-title{font-size:14px;font-weight:600;flex:1;}
.task-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.announcement{background:linear-gradient(135deg,#fffdf5,#fff9e8);border:1px solid rgba(245,166,35,.3);border-left:3px solid var(--accent2);border-radius:10px;padding:16px;margin-bottom:12px;}
.announcement-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--gold3);background:rgba(245,166,35,.12);padding:2px 8px;border-radius:10px;margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase;}
.announcement-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px;}
.announcement-body{font-size:13px;color:var(--text2);line-height:1.6;}
.announcement-time{font-size:11px;color:var(--muted);margin-top:8px;}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#fffdf5 0%,#fef3d0 50%,#fff9e8 100%);padding:24px;}
.login-box{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px;box-shadow:0 8px 40px rgba(180,130,0,.15);}
.login-logo{text-align:center;margin-bottom:30px;}
.login-logo img{width:90px;height:90px;object-fit:contain;margin-bottom:12px;}
.login-logo h1{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;color:var(--accent);margin-bottom:2px;}
.login-logo p{color:var(--muted);font-size:13px;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.8px;text-transform:uppercase;}
.form-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:11px 14px;font-size:14px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .15s;}
.form-input:focus{border-color:var(--accent2);background:#fff;}
.form-input::placeholder{color:#c4b080;}
select.form-input option{background:white;color:var(--text);}
.error-msg{font-size:12px;color:#dc2626;margin-top:8px;font-weight:500;}
.member-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;box-shadow:var(--shadow);transition:all .15s;margin-bottom:10px;}
.member-card:hover{box-shadow:var(--shadow-lg);border-color:var(--border2);}
.modal-overlay{position:fixed;inset:0;background:rgba(26,22,8,.65);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(2px);}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:30px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(180,130,0,.2);}
.modal h3{font-size:18px;font-weight:700;margin-bottom:20px;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
.status-tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:10px;margin-bottom:16px;border:1px solid var(--border);}
.status-tab{flex:1;padding:7px 10px;border-radius:7px;border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s;}
.status-tab.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow);border:1px solid var(--border);}
.progress-bar{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold2),var(--accent2));border-radius:3px;transition:width .4s;}
.empty{text-align:center;padding:48px 24px;color:var(--muted);}
.empty-icon{font-size:44px;margin-bottom:12px;}
.empty h3{font-size:15px;font-weight:700;color:var(--text2);margin-bottom:6px;}
.divider{height:1px;background:var(--border);margin:16px 0;}
.flex{display:flex;align-items:center;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.gap-8{gap:8px;}.gap-12{gap:12px;}
.mb-8{margin-bottom:8px;}.mb-12{margin-bottom:12px;}.mb-16{margin-bottom:16px;}.mb-20{margin-bottom:20px;}
.section-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;}
/* Login info box */
.login-info-box{background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:10px;padding:16px;margin-top:16px;}
.login-info-box .info-title{font-size:12px;font-weight:700;color:#16a34a;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}
.login-info-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #dcfce7;font-size:13px;}
.login-info-row:last-child{border-bottom:none;}
.login-info-label{color:#15803d;font-weight:500;}
.login-info-value{font-family:'Courier New',monospace;font-weight:700;color:#166534;background:#dcfce7;padding:2px 8px;border-radius:4px;font-size:12px;}
/* Department badge */
.dept-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:rgba(245,166,35,.15);color:var(--gold4);border:1px solid rgba(245,166,35,.3);}
/* Connecting indicator */
.connecting{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;color:var(--muted);font-size:13px;}
.dot-pulse{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.8);}}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
</style>
</head>

// ── Persistence ───────────────────────────────────────────────────
function save(){
  try{
    localStorage.setItem('es_members',JSON.stringify(state.members));
    localStorage.setItem('es_tasks',JSON.stringify(state.tasks));
    localStorage.setItem('es_announcements',JSON.stringify(state.announcements));
  }catch(e){}
}
function load(){
  try{
    const m=localStorage.getItem('es_members');
    const t=localStorage.getItem('es_tasks');
    const a=localStorage.getItem('es_announcements');
    const u=localStorage.getItem('es_currentUser');
    if(m)state.members=JSON.parse(m);
    if(t)state.tasks=JSON.parse(t);
    if(a)state.announcements=JSON.parse(a);
    if(u){
      const saved=JSON.parse(u);
      if(saved.role==='manager'){state.currentUser=saved;state.activeNav='dashboard';}
      else{
        const mem=state.members.find(mm=>mm.email===saved.email);
        if(mem){state.currentUser={role:'member',...mem};state.activeNav='my-tasks';}
      }
    }
  }catch(e){}
}
function saveUser(u){try{localStorage.setItem('es_currentUser',JSON.stringify(u));}catch(e){}}
function clearUser(){try{localStorage.removeItem('es_currentUser');}catch(e){}}

// ── Render ────────────────────────────────────────────────────────
function render(){
  const root=document.getElementById('root');
  if(!state.currentUser){root.innerHTML=renderLogin();bindLogin();return;}
  if(state.currentUser.role==='manager'){root.innerHTML=renderManager();bindNav();}
  else{root.innerHTML=renderMember();bindNav();}
  if(state.modal)renderModal();
}

function renderLogin(){
  return `<div class="login-screen"><div class="login-box">
    <div class="login-logo">
      <img src="${LOGO_DATA}" alt="Easy Solutions">
      <h1>Easy Solutions</h1>
      <p>Task Management Platform</p>
    </div>
    <div class="form-group"><label class="form-label">Email Address</label>
      <input class="form-input" id="li-email" type="email" placeholder="your@easysolutions.com">
    </div>
    <div class="form-group"><label class="form-label">Password</label>
      <input class="form-input" id="li-pass" type="password" placeholder="••••••••">
    </div>
    <div id="li-error" class="error-msg" style="display:none;margin-bottom:12px;"></div>
    <button class="btn btn-primary" id="li-btn" style="width:100%;justify-content:center;padding:12px;font-size:14px;">Sign In →</button>
    <div style="margin-top:16px;text-align:center;font-size:12px;color:var(--muted);">Contact your manager for login credentials</div>
  </div></div>`;
}
function bindLogin(){
  document.getElementById('li-btn').onclick=doLogin;
  document.getElementById('li-pass').onkeydown=e=>{if(e.key==='Enter')doLogin();};
}
function doLogin(){
  const email=document.getElementById('li-email').value.trim().toLowerCase();
  const pass=document.getElementById('li-pass').value;
  const err=document.getElementById('li-error');
  err.style.display='none';
  if(email===MANAGER_CREDS.email&&pass===MANAGER_CREDS.password){
    state.currentUser={role:'manager',name:'Manager',email,avatar:'MG',color:'#f59e0b'};
    saveUser(state.currentUser);state.activeNav='dashboard';render();return;
  }
  const member=state.members.find(m=>m.email.toLowerCase()===email);
  if(member&&pass===member.password){
    state.currentUser={role:'member',...member};
    saveUser(state.currentUser);state.activeNav='my-tasks';render();return;
  }
  err.textContent='Invalid email or password. Contact your manager.';err.style.display='block';
}

// ── Manager shell ─────────────────────────────────────────────────

  if(nav==='dashboard')content=renderManagerDashboard();
  else if(nav==='tasks')content=renderManagerTasks();
  else if(nav==='members')content=renderManagerMembers();
  else if(nav==='announcements')content=renderManagerAnnouncements();
  return `<div class="app">
    <aside class="sidebar">
      <div class="logo"><img src="${LOGO_DATA}" alt="Logo">
        <div><div class="logo-name">Easy Solutions</div><div class="logo-sub">Task Manager</div></div>

    <main class="main">${content}</main>
  </div>`;
}

function renderManagerDashboard(){
  const total=state.tasks.length,done=state.tasks.filter(t=>t.status==='done').length;

  const urgent=state.tasks.filter(t=>t.priority==='urgent'&&t.status!=='done');
  const pct=total?Math.round(done/total*100):0;
  return `<div class="topbar"><div><div class="page-title">Dashboard</div><div class="page-sub">Welcome back — here's your team overview</div></div>
    <div class="topbar-actions"><button class="btn btn-primary" onclick="openModal('add-task','')">+ New Task</button></div></div>

      <div class="stat-card"><div class="stat-stripe" style="background:linear-gradient(90deg,#f87171,#dc2626)"></div><div class="stat-value" style="color:#dc2626">${urgent.length}</div><div class="stat-label">Urgent</div></div>
    </div>

        <div class="progress-bar mb-16"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${state.members.map(m=>{const mt=state.tasks.filter(t=>t.assignedTo===m.id),md=mt.filter(t=>t.status==='done').length,mp=mt.length?Math.round(md/mt.length*100):0;return `<div style="margin-bottom:12px;"><div class="flex-between" style="margin-bottom:5px;"><div class="flex gap-8"><div class="avatar" style="width:24px;height:24px;font-size:9px;background:${m.color}22;color:${m.color};">${m.avatar}</div><div><span style="font-size:13px;font-weight:500">${m.name}</span>${m.department?`<span class="dept-badge" style="margin-left:6px;">${m.department}</span>`:''}</div></div><span style="font-size:12px;color:var(--muted);font-weight:600">${md}/${mt.length}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${mp}%;background:${m.color}"></div></div></div>`;}).join('')}
      </div>

        <div class="flex-between mb-16"><span class="section-title">Announcements</span><button class="btn btn-ghost btn-sm" onclick="setNav('announcements')">View all</button></div>
        ${state.announcements.slice(0,2).map(a=>`<div class="announcement"><div class="announcement-badge">📢 ${a.pinned?'📌 Pinned':'Announcement'}</div><div class="announcement-title">${a.title}</div><div class="announcement-time">${a.createdAt}</div></div>`).join('')}

  </div>`;
}

  const f=state.taskFilter;

  return `<div class="topbar"><div><div class="page-title">All Tasks</div><div class="page-sub">${state.tasks.length} tasks across ${state.members.length} members</div></div>

// ── Actions ───────────────────────────────────────────────────────
function openModal(type,data){state.modal={type,data};renderModal();}
function closeModal(){state.modal=null;const o=document.getElementById('modal-overlay');if(o)o.remove();}
function setNav(nav){state.activeNav=nav;state.taskFilter='all';render();}
function setFilter(f){state.taskFilter=f;render();}
function logout(){state.currentUser=null;state.activeNav='dashboard';clearUser();render();}
function bindNav(){document.querySelectorAll('[data-nav]').forEach(el=>{el.onclick=()=>setNav(el.dataset.nav);});}

function addMember(){
  const name=document.getElementById('m-name').value.trim();
  const email=document.getElementById('m-email').value.trim().toLowerCase();
  const password=document.getElementById('m-password').value.trim();
  const department=document.getElementById('m-dept').value.trim();
  if(!name||!email||!password){alert('Please fill in name, email and password.');return;}
  if(state.members.find(m=>m.email.toLowerCase()===email)){alert('A member with this email already exists.');return;}
  const initials=name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  const color=DEPT_COLORS[state.members.length%DEPT_COLORS.length];
  const newMember={id:'m'+Date.now(),name,email,password,department,avatar:initials,color};
  state.members.push(newMember);
  save();closeModal();
  // Show credentials immediately
  state.modal={type:'view-credentials',data:newMember.id};
  render();
}

function updateMember(id){
  const m=state.members.find(x=>x.id===id);if(!m)return;
  const name=document.getElementById('m-name').value.trim();
  const email=document.getElementById('m-email').value.trim().toLowerCase();
  const password=document.getElementById('m-password').value.trim();
  const department=document.getElementById('m-dept').value.trim();
  if(!name||!email||!password){alert('Please fill in all fields.');return;}
  const dup=state.members.find(x=>x.email.toLowerCase()===email&&x.id!==id);
  if(dup){alert('Another member already uses this email.');return;}
  m.name=name;m.email=email;m.password=password;m.department=department;
  m.avatar=name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  // update logged-in member if editing self
  if(state.currentUser&&state.currentUser.id===id){state.currentUser={...state.currentUser,...m};saveUser(state.currentUser);}
  save();closeModal();render();
}

function deleteMember(id){
  if(!confirm('Remove this member? Their tasks will remain.'))return;
  state.members=state.members.filter(m=>m.id!==id);
  save();render();
}

function copyCredentials(name,email,password){
  const text=`Easy Solutions — Task Manager\n\nHello ${name},\n\nYour login details:\n🌐 URL: https://sittukumar95.github.io/easysolutions-tasks\n📧 Email: ${email}\n🔒 Password: ${password}\n\nPlease keep your password safe.`;
  navigator.clipboard.writeText(text).then(()=>alert('✅ Credentials copied to clipboard! Paste and send to '+name)).catch(()=>alert('Copy manually:\n\n'+text));
}

function submitTask(){
  const title=document.getElementById('m-title').value.trim();
  const desc=document.getElementById('m-desc').value.trim();
  const assignedTo=document.getElementById('m-assign').value;
  const priority=document.getElementById('m-priority').value;
  const dueDate=document.getElementById('m-due').value;
  if(!title||!assignedTo){alert('Please fill in task title and assign to a member.');return;}
  state.tasks.push({id:'t'+Date.now(),title,description:desc,assignedTo,priority,status:'todo',dueDate,createdAt:new Date().toISOString().slice(0,10)});
  save();closeModal();render();
}

function saveTask(id){
  const task=state.tasks.find(t=>t.id===id);if(!task)return;
  task.title=document.getElementById('m-title').value.trim();
  task.description=document.getElementById('m-desc').value.trim();
  task.assignedTo=document.getElementById('m-assign').value;
  task.priority=document.getElementById('m-priority').value;
  task.dueDate=document.getElementById('m-due').value;
  save();closeModal();render();
}

function deleteTask(id){if(!confirm('Delete this task?'))return;state.tasks=state.tasks.filter(t=>t.id!==id);save();closeModal();render();}
function updateStatus(taskId,newStatus){const task=state.tasks.find(t=>t.id===taskId);if(task)task.status=newStatus;save();closeModal();render();}

function submitAnnouncement(){
  const title=document.getElementById('m-ann-title').value.trim();
  const body=document.getElementById('m-ann-body').value.trim();
  const pinned=document.getElementById('m-ann-pin').checked;
  if(!title||!body){alert('Please fill in all fields.');return;}
  state.announcements.unshift({id:'a'+Date.now(),title,body,pinned,createdAt:new Date().toISOString().slice(0,10)});
  save();closeModal();render();
}

function saveAnnouncement(id){
  const a=state.announcements.find(x=>x.id===id);if(!a)return;
  a.title=document.getElementById('m-ann-title').value.trim();
  a.body=document.getElementById('m-ann-body').value.trim();
  a.pinned=document.getElementById('m-ann-pin').checked;
  save();closeModal();render();
}

function deleteAnnouncement(id){if(!confirm('Delete this announcement?'))return;state.announcements=state.announcements.filter(a=>a.id!==id);save();render();}

// ── Init ──────────────────────────────────────────────────────────
load();render();
</script>
</body>
</html>
